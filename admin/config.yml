  - name: book-series
    label: Book Series
    files:
      - file: _data/hymns.yml
        label: Book Series Content
        name: book_series
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - name: series
            label: "Series"
            widget: "list"
            fields:
              - { label: "Series Title", name: "title", widget: "string" }
              - { label: "Series Cover", name: "cover", widget: "image", required: false }
              - { label: "Series Description", name: "description", widget: "markdown", required: false }
              - name: books
                label: "Books"
                widget: "list"
                fields:
                  - { label: "Book Title", name: "title", widget: "string" }
                  - { label: "Book Cover", name: "cover", widget: "image", required: false }
                  - { label: "Author or Credit", name: "author", widget: "string", required: false }
