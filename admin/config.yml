backend:
  name: github
  repo: Mizuki-5055/Mizuki-5055.github.io
  branch: main
  base_url: https://sveltia-cms-auth.hibitaeru.workers.dev

media_folder: images/uploads
public_folder: /images/uploads

collections:
  # ==========================================
  # GALLERY COLLECTION
  # ==========================================
  - name: gallery
    label: Gallery
    files:
      - file: _data/gallery.yml
        label: Gallery Settings
        name: gallery
        fields:
          - { label: Page Heading, name: heading, widget: string, required: false }
          - { label: Intro Text, name: intro, widget: text, required: false }
          - name: items
            label: Gallery Items
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Image, name: image, widget: image }

  # ==========================================
  # SITE SETTINGS COLLECTION (NEW)
  # ==========================================
  - name: settings
    label: Site Settings
    files:
      - file: _data/settings.yml
        label: Background
        name: background
        fields:
          - { 
              label: Background Image, 
              name: background_image, 
              widget: image, 
              required: false,
              hint: "Upload a large image. A dark overlay keeps text readable."
            }
