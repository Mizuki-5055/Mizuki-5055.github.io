<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager · Helelism</title>
  <script src="https://unpkg.com/sveltia-cms@0.5.5/dist/sveltia-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      publishMode: 'simple',
      config: {
        backend: {
          name: 'github',
          repo: 'Mizuki-5055/helelism',
          branch: 'main',
          base_url: 'https://sveltia-cms-auth.hibitaeru.workers.dev'
        },
        media_folder: 'images/uploads',
        public_folder: '/images/uploads',
        collections: [
          {
            name: 'gallery',
            label: 'Gallery',
            folder: '_data/gallery',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Description', name: 'description', widget: 'text', required: false },
              { label: 'Image', name: 'image', widget: 'image' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
