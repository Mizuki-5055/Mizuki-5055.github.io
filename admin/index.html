<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager · The Hopes of Fallen Stars</title>
</head>
<body>
  <script>
    window.SVELTIA_CMS_CONFIG = {
      backend: {
        name: "github",
        repo: "Mizuki-5055/Mizuki-5055.github.io",
        branch: "main"
      },
      media_folder: "images/uploads",
      public_folder: "/images/uploads",
      collections: [
        {
          name: "homepage",
          label: "Homepage",
          files: [
            {
              file: "_data/homepage.yml",
              label: "Homepage Hero Text",
              name: "hero",
              fields: [
                { label: "Main Title", name: "hero_title", widget: "string" },
                { label: "Welcome Text", name: "hero_tagline", widget: "text" }
              ]
            }
          ]
        },
        {
          name: "book-series",
          label: "Book Series",
          files: [
            {
              file: "_data/hymns.yml",
              label: "Book Series Content",
              name: "book_series",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Introduction", name: "intro", widget: "text" },
                {
                  name: "series",
                  label: "Series",
                  widget: "list",
                  fields: [
                    { label: "Series Title", name: "title", widget: "string" },
                    { label: "Series Description", name: "description", widget: "markdown", required: false },
                    {
                      name: "books",
                      label: "Books",
                      widget: "list",
                      fields: [
                        { label: "Book Title", name: "title", widget: "string" },
                        { label: "Author or Credit", name: "author", widget: "string", required: false },
                        {
                          name: "bodies",
                          label: "Chapters",
                          widget: "list",
                          fields: [
                            { label: "Chapter Heading", name: "heading", widget: "string" },
                            { label: "Chapter Text", name: "body", widget: "markdown" }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "calendar",
          label: "Helvarian Calendar",
          files: [
            {
              file: "_data/calendar.yml",
              label: "Calendar and Dated Entries",
              name: "calendar",
              fields: [
                { label: "Calendar Heading", name: "heading", widget: "string", required: false },
                { label: "Introduction", name: "intro", widget: "text", required: false },
                {
                  name: "dates",
                  label: "Dated Entries",
                  widget: "list",
                  summary: "{{fields.month}} {{fields.day}}, Year {{fields.year}}",
                  fields: [
                    { label: "Year", name: "year", widget: "number", value_type: "int", min: 1 },
                    {
                      label: "Month",
                      name: "month",
                      widget: "select",
                      options: ["REGNIS", "MEMENTIS", "LUCIDIS", "GELIDIS", "VARMER", "DRACCER", "HELARI", "NUBILLIS", "FLORRER", "VOKSER", "ABRAXI", "SOLARI"]
                    },
                    { label: "Day of Month", name: "day", widget: "number", value_type: "int", min: 1, max: 31 },
                    {
                      name: "entries",
                      label: "Entries for This Date",
                      widget: "list",
                      fields: [
                        { label: "Entry Title", name: "title", widget: "string" },
                        { label: "Calendar Preview", name: "preview", widget: "markdown", required: false },
                        { label: "Full Entry Content", name: "content", widget: "markdown", required: false }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "extra-lore",
          label: "Extra Lore",
          files: [
            {
              file: "_data/literature.yml",
              label: "Extra Lore Content",
              name: "extra_lore",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Introduction", name: "intro", widget: "text" },
                {
                  name: "items",
                  label: "Lore Entries",
                  widget: "list",
                  fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Author or Credit", name: "author", widget: "string", required: false },
                    { label: "Lore Text", name: "description", widget: "markdown", required: false }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "about-helvar",
          label: "About Helvar",
          files: [
            {
              file: "_data/about.yml",
              label: "About Helvar Page",
              name: "about_helvar",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "About Helvar Text", name: "body", widget: "markdown" }
              ]
            }
          ]
        },
        {
          name: "maps",
          label: "Maps",
          files: [
            {
              file: "_data/test.yml",
              label: "Maps and Images",
              name: "maps",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string", required: false },
                { label: "Introduction", name: "intro", widget: "text", required: false },
                {
                  name: "items",
                  label: "Maps and Images",
                  widget: "list",
                  fields: [
                    { label: "Map Title", name: "title", widget: "string" },
                    { label: "Description", name: "description", widget: "markdown", required: false },
                    { label: "Map Image", name: "image", widget: "image" }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "characters",
          label: "Characters",
          files: [
            {
              file: "_data/scripture.yml",
              label: "Character Profiles",
              name: "characters",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Introduction", name: "intro", widget: "text" },
                {
                  name: "items",
                  label: "Characters",
                  widget: "list",
                  fields: [
                    { label: "Character Name", name: "title", widget: "string" },
                    { label: "Additional Details", name: "reference", widget: "string", required: false },
                    { label: "Character Description", name: "description", widget: "markdown", required: false }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "author",
          label: "Author",
          files: [
            {
              file: "_data/knowledge.yml",
              label: "Author Page Content",
              name: "author_page",
              fields: [
                { label: "Page Title", name: "title", widget: "string" },
                { label: "Introduction", name: "subtitle", widget: "text", required: false },
                {
                  name: "dropdowns",
                  label: "Author Sections",
                  widget: "list",
                  fields: [
                    { label: "Section Heading", name: "heading", widget: "string" },
                    { label: "Short Subtitle", name: "subtitle", widget: "text", required: false },
                    { label: "Section Text", name: "body", widget: "markdown" }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "helvarian-myths",
          label: "Helvarian Myths",
          files: [
            {
              file: "_data/truth.yml",
              label: "Helvarian Myths Content",
              name: "helvarian_myths",
              fields: [
                { label: "Page Title", name: "title", widget: "string" },
                { label: "Introduction", name: "subtitle", widget: "text", required: false },
                { label: "Banner Image", name: "image", widget: "image", required: false },
                { label: "Main Text", name: "body", widget: "markdown", required: false },
                {
                  name: "dropdowns",
                  label: "Myths and Stories",
                  widget: "list",
                  fields: [
                    { label: "Story Heading", name: "heading", widget: "string" },
                    { label: "Story Text", name: "content", widget: "markdown" }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "navigation",
          label: "Site Navigation",
          files: [
            {
              file: "_data/navigation.yml",
              label: "Menu Links",
              name: "menus",
              fields: [
                {
                  label: "Top Menu",
                  name: "top_nav",
                  widget: "list",
                  fields: [
                    { label: "Link Name", name: "label", widget: "string" },
                    { label: "Page URL", name: "url", widget: "string" }
                  ]
                },
                {
                  label: "Sidebar Menu",
                  name: "sidebar_nav",
                  widget: "list",
                  fields: [
                    { label: "Link Name", name: "label", widget: "string" },
                    { label: "Page URL", name: "url", widget: "string" }
                  ]
                },
                {
                  label: "Social Links",
                  name: "social_links",
                  widget: "list",
                  fields: [
                    { label: "Link Name", name: "label", widget: "string" },
                    { label: "Link URL", name: "url", widget: "string" }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: "settings",
          label: "Site Appearance",
          files: [
            {
              file: "_data/settings.yml",
              label: "Background and Sidebar Text",
              name: "settings",
              fields: [
                { label: "Background Image", name: "background_image", widget: "image", required: false },
                { label: "Sidebar Introduction", name: "sidebar_bio", widget: "text", required: false }
              ]
            }
          ]
        }
      ]
    };
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
