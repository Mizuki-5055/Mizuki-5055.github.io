<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager · Helelism</title>
</head>
<body>
  <script>
    window.SVELTIA_CMS_CONFIG = {
      backend: {
        name: "github",
        repo: "Mizuki-5055/Mizuki-5055.github.io",
        branch: "main"
      },
      media_folder: "images/uploads",
      public_folder: "/images/uploads",
      collections: [
        // ==========================================
        // GALLERY
        // ==========================================
        {
          name: "gallery",
          label: "Gallery",
          files: [
            {
              file: "_data/test.yml",
              label: "Gallery Settings",
              name: "gallery",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string", required: false },
                { label: "Intro Text", name: "intro", widget: "text", required: false },
                {
                  name: "items",
                  label: "Gallery Items",
                  widget: "list",
                  fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Description", name: "description", widget: "text", required: false },
                    { label: "Image", name: "image", widget: "image" }
                  ]
                }
              ]
            }
          ]
        },
        // ==========================================
        // SITE SETTINGS (Background + Bio)
        // ==========================================
        {
          name: "settings",
          label: "Site Settings",
          files: [
            {
              file: "_data/settings.yml",
              label: "Background & Bio",
              name: "settings",
              fields: [
                { label: "Background Image", name: "background_image", widget: "image", required: false },
                { label: "Sidebar Bio", name: "sidebar_bio", widget: "text", required: false }
              ]
            }
          ]
        },
        // ==========================================
        // HOMEPAGE (Hero)
        // ==========================================
        {
          name: "homepage",
          label: "Homepage",
          files: [
            {
              file: "_data/homepage.yml",
              label: "Hero Section",
              name: "hero",
              fields: [
                { label: "Hero Title", name: "hero_title", widget: "string" },
                { label: "Hero Tagline", name: "hero_tagline", widget: "text" },
                { label: "Button Text", name: "hero_button_text", widget: "string" },
                { label: "Button URL", name: "hero_button_url", widget: "string" }
              ]
            }
          ]
        },
        // ==========================================
        // NAVIGATION (Top, Sidebar, Social)
        // ==========================================
        {
          name: "navigation",
          label: "Navigation",
          files: [
            {
              file: "_data/navigation.yml",
              label: "Menus",
              name: "menus",
              fields: [
                {
                  label: "Top Navigation",
                  name: "top_nav",
                  widget: "list",
                  fields: [
                    { label: "Label", name: "label", widget: "string" },
                    { label: "URL", name: "url", widget: "string" }
                  ]
                },
                {
                  label: "Sidebar Navigation",
                  name: "sidebar_nav",
                  widget: "list",
                  fields: [
                    { label: "Label", name: "label", widget: "string" },
                    { label: "URL", name: "url", widget: "string" }
                  ]
                },
                {
                  label: "Social Links",
                  name: "social_links",
                  widget: "list",
                  fields: [
                    { label: "Label", name: "label", widget: "string" },
                    { label: "URL", name: "url", widget: "string" }
                  ]
                }
              ]
            }
          ]
        },
        // ==========================================
        // HYMNS
        // ==========================================
        {
          name: "hymns",
          label: "Hymns",
          files: [
            {
              file: "_data/hymns.yml",
              label: "Hymns List",
              name: "hymns",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Intro Text", name: "intro", widget: "text" },
                {
                  name: "items",
                  label: "Hymns",
                  widget: "list",
                  fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Author", name: "author", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text", required: false }
                  ]
                }
              ]
            }
          ]
        },
        // ==========================================
        // LITERATURE
        // ==========================================
        {
          name: "literature",
          label: "Literature",
          files: [
            {
              file: "_data/literature.yml",
              label: "Literature List",
              name: "literature",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Intro Text", name: "intro", widget: "text" },
                {
                  name: "items",
                  label: "Works",
                  widget: "list",
                  fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Author", name: "author", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text", required: false }
                  ]
                }
              ]
            }
          ]
        },
        // ==========================================
        // SCRIPTURE
        // ==========================================
        {
          name: "scripture",
          label: "Scripture",
          files: [
            {
              file: "_data/scripture.yml",
              label: "Scripture List",
              name: "scripture",
              fields: [
                { label: "Page Heading", name: "heading", widget: "string" },
                { label: "Intro Text", name: "intro", widget: "text" },
                {
                  name: "items",
                  label: "Verses",
                  widget: "list",
                  fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Reference", name: "reference", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text", required: false }
                  ]
                }
              ]
            }
          ]
        }
      ]
    };
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
