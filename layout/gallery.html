---
layout: default
---

<section class="gallery-grid">
  {% assign gallery_items = site.data.gallery | default: site.data._data.gallery %}
  {% if gallery_items %}
    {% for item in gallery_items %}
    <div class="gallery-item">
      <img src="{{ item.image }}" alt="{{ item.title }}" />
      <div class="info">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <p>No gallery entries yet. Add some via the CMS at <a href="/admin/">/admin/</a>.</p>
  {% endif %}
</section>
