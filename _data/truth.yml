title: Helvarian Myths
subtitle: In universe myths and legends throughout the history of Helvar.
image: ''
body: ''
dropdowns:
  - heading: Helvarian Mythos
    content: |-
      Abraxa, Dracci and Lucia had just lost the unconditional freedom granted to them upon their primordial manifestation, but that paled in comparison to the loss of two of their dearest friends: Sokhu and Varmara, lost to an unknown cosmic void driven force. Varmara was a moon goddess and wife to the sun God: Helel. Sokhu was a minor god of Creation, he used parts of his being to create and manifest life from his body. Abraxa was an old and wise primordial God of creation and elder brother to Sokhu. It is said Abraxa tamed the universe and dispersed amongst them laws for it to obey, from Mathematics, To science, alchemy and magic, he along with the other primordial gods did this eons ago, Helel was also one such god who now sits at the center of the universe watching over its expanse. Lucia was the goddess of the galaxies, she placed every Star in the skies, every planet in its orbit and assigned every minor sun to their solar system. She created constellations and weaved fates. 

      She even crafted Varmara’s Moon upon her manifestation (birth). Lucia also set rules upon her galaxies and solar systems making sure that the suns ruled the planets orbit and that the moon ruled the planets reflecting the suns will upon the planets, along with giving the moons the domain of water, having them control the waves. Dracci was a primordial god in of its self, well actually Dracci was a combination of two primordial cosmic gods fused Into one being, the primordial Draconic God of the eternal flame of wisdom (Draco), and the primordial Draconic Goddess of the Soul splitting Lightning (Avacci). When merged they became Dracci, they had the power of all knowledge of the universe and the role to disperse souls into beings, along with maintaining the flow of knowledge, truth and life, they commanded immortality and death, and had the power to traverse all of space time and even reality at will, they were the last of the primordial Draconic beings older than the primordial gods themselves, however, before even Helel, Abraxa or the events that killed Varmara and her daughter, eons earlier Dracci faced off in an epic battle that left them with severe memory lost and weakened power, hence why they know traverse the universe in search of the memories and knowledge and power they lost. Which is how they met their friends. 

      Now that we’re caught up to speed on the history before the death of Varmara, it’s time for the events that happened right after. Xylinthis had just perished, her mother weakened and cracked, Sokhu lay motionless, he had died earlier. Varmara plucked her daughter heart from her chest (which the gods later gave to Xypher to bring back to helel to announce their death), and cradled it, they then adhered to Sokhu dying wish “use my body and encase the child within it so that she may live in slumber, forever stuck in an eternal joyful dream” however she died way too soon for the dream section to come to fruition. Her mother Varmara died soon after, using the very little power she had left to imbue her lunar protection and reflect Sokhu dying wish on the nascent planet that was now her daughter. With Varmaras last duty as a moon reflected and fulfilled, her moon cracked and she died. The remaining three gods then imbued the planet with their magic to protect it, this caused many phenomena to occur, however attention was quickly overtaken by Xyphers arrival. 

      After the whole ordeal came the chains of Helel. Helel furious at the death of his wife and daughter, bonded the three gods to Valmaras domain which encompassed her solar system, though this system was unique as the Sun god that once ruled here was long since slain by Helel millennia ago, leaving behind a hollow shell of a dying sun, though this doesn’t affect the solar system or laws (think of it like how our own irl sun is basically a giant dying star or sun). Since Varmara had no sun to command her besides her husband she instead answered to him, even though he was light years away. This made her sole ruler of the solar system making it a Lunar system. In this system exist one dying star (sun), Valmara (the moon _now fractured_), a new planet (her daughter _Helvar_), and 4 other uninhabited and smaller planets with no life (used as thrones for her god friends when they visited her), her twin children (stars _both now dead_) used to have a placement on either side of her. Bonded to this lunar system, Helel did not allow them to leave its vicinity, forever tasking them with watching and protecting his bereaved. 

      Upon learning of this they could do nothing but oblige and hang their heads in shame and guilt. However all was not sorrowful as they soon learned. Upon staring at the world of Helvar after being imbued with power from all of them alongside Valmara and Sokhu last wish, they saw life begin to thrive. Three main continents riddled the planet, with two smaller ones near the center, and a beautiful clear transparent ocean divided them. Each of the three gods carefully approached the planet and in doing so unintentionally bestowed upon the immediate area with the affinity of their aura. Dracci landed in the Ocean now called Orion, and slithered their way unto the continent now known as Arkinet. Lucia lightly floated down to glide above the continent now known as Aurora, west, near the Lichaen Ocean. And finally Abraxa fashioned a mountain in the northwestern part of the biggest continent, now known as Isdrivore, so that he may sit on it. Isdrivore being north of the biggest ocean now known as the Vhorian Ocean. They all stopped and admired the magic that had innately taken place after the heavy loss of life. Flowers were blooming, forests were emerging, and rivers were slithering into the ocean. Next Abraxa have all three of them a stone he plucked from the ocean floor and tasked them all to crush it and disperse the remains of it amongst the land ocean around them, and so they did and from this animals were created in the affinity related to the gods nature and power.

       The gods marveled at the sight and soon began to explore each other’s territories. Having seen what Abraxa had done to the land with his mountain, they scolded him for his brashness, but since life now teemed there, they couldn’t nor wouldn’t destroy it. A while later they looked up at the sky and saw Xypher zooming by towards the fractured remains of the moon that now hang above the world as a solemn reminder of a mother, a goddess and a friend. They went up to see if there was an issue but they were met instead with Xypher imbuing a part of His father Helel’s being into the center of the fractured moon, before he turned and they noticed he had a thick blindfold on his eyes. He merely said “I’ll avenge them” before darting off, the gods about to pursue him but the sight of a radiant light stopped them in their tracks, it was Helel, bringing together the fractured pieces of his moon, and caressing it whilst whispering to his late wife his undying love. They decided it was best to not intrude on the intimate moment and they went back down Helvar in which they named after both Helel and Varmara. Now bonded to this world, the gods decided to protect and defend the life found here, Dracci was the one to bring this up, in her mind they knew they were getting old and that the possibility of finding her old memories and power were in vain, but they decided to give themselves one more final chance at redemption. 

      They summoned a lightningbolt and then encased it in fire. From it she fashioned it into a serpent and placed it on the ground before covering it. They then imbued it with a soul and created the first serpent. Dracci then split it into 4 androgynous serpent dragons, though still in a hive mind state, they then all said together in unison: “these are my chosen successors, for whom I will care for internally in my head, may the land I stepped foot in be blessed with my life force, may the fires that burn within my veins flow and burn within them, may the lightning that empowers me empower their endeavors, may they succeed in the goal of full enlightenment, where I have failed.” The four dragons then themselves split into two, one male and one female version, and quickly dispersed upon the land Dracci had now deemed Arkinet. Abraxa and Lucia were in awe as now all that was left of Dracci was a dull looking husk of their former self.

       Abraxa then took a pair of small doves from his mountain and buried it in sand before speaking “you are my creations, you will be my pride and my legacy, I will teach you everything I know, and you will surpass me in every way” and from the sand where the two doves were buried, arose a bare Eldric couple. Lucia was next, from her forest she called out to two butterflies, which promptly landed on her shoulder. She took them in the palm of her hand and she then encased them in ice before burying them. She then said “you are my children, and I am your mother, I will care for you, protect you, nurture you and guide you, you will become everything that encompasses me, and then you will surpass me and I'll be cared for by you.” And with this a bare Fae couple emerged, however they retained the small size of the butterflies. Lucia, quickly became annoyed when Abraxa and Dracci chuckled, for it seemed they also retained Lucia’s coy embarrassment, not to worry for Lucia quickly asked them to bury themselves again, and this time she made sure to make them human size. (Fae used to have butterfly wings up until Lucia’s death.), And with this, this concludes how the original three magical races emerged.
