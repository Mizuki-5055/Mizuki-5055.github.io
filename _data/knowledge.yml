      - <strong>Telat</strong>: Three
      - <strong>Temane</strong>: Eight
      - <strong>Tesh'a</strong>: Nine
      - <strong>Tod'a</strong>: Consciousness / knowledge
      - <strong>Trein</strong>: Two
      - <strong>Yahweh</strong>: Child of K'inati
      - <strong>Yarikh</strong>: Canaanite form of Malhelel
      - <strong>Yarikh Hekarta</strong>: the moon city recently known as Jericho
  - heading: External Corroborations of Helelism
    subtitle: A Comprehensive Dossier
    body: |-
      # Introduction

      This dossier compiles external evidence from archaeology, biblical scholarship, comparative religion, and the physical sciences that corroborates the core claims of <strong>Helelism</strong>. The evidence is organized by the <strong>Helelist</strong> claim it supports, followed by the external corroborating material.

      ---

      ## I. The Plurality of the Divine: Elohim as a Collective

      <strong>Helelist Claim:</strong> The <strong>Elohim</strong> are a collective of sovereign divine beings, not a single deity. <strong>Helel</strong> is the <strong>God of Gods</strong>, the supreme among many.

      <strong>External Corroboration:</strong>

      The Hebrew word <strong>Elohim</strong> (אֱלֹהִים) is grammatically plural, yet it takes singular verbs in Genesis 1:1. One source notes that "Elohim, normally translated 'God', is grammatically plural, but the Hebrew verb for creating is here conjugated as singular… In 1.26 Elohim speaks in the plural, implying some kind of divine council". Another source confirms: "The plural noun Elohim of Genesis 1:1 takes a singular verb bara: he-created".

      This grammatical anomaly—plural noun, singular verb—is a remnant of an earlier polytheistic framework that was later overlaid with monotheistic redaction. The plural <strong>Elohim</strong> preserves the memory of a divine council.

      Psalm 82 describes God (<strong>Elohim</strong>) standing "in the council of heaven; in the midst of the gods he gives judgement". The psalm addresses the "gods" (elohim) directly: "I say, 'You are gods, sons of the Most High, all of you; nevertheless, you shall die like men, and fall like any prince'". This is a divine council of beings called elohim—gods—who are subordinate to the Most High and subject to death.

      Deuteronomy 32:8 in the Dead Sea Scrolls (4QDeutj) reads "sons of God" rather than the Masoretic Text's "sons of Israel." One source states: "While the Qumran fragment (like the Septuagint) reads 'Sons of God,' the MT reads 'sons of Israel.' Hendel asserts that the Qumran reading has polytheistic overtones that later scribes found unacceptable". The original text described the Most High dividing the nations "according to the number of the sons of God"—divine beings, not human tribes.

      ---

      ## II. El and Yahweh as Distinct Deities Later Conflated

      <strong>Helelist Claim:</strong> <strong>El</strong> is <strong>K'inati</strong>, a distinct deity who later merged with his son <strong>Yahweh</strong>. The names <strong>El</strong> and <strong>Yahweh</strong> were originally separate.

      <strong>External Corroboration:</strong>

      Scholarship confirms that <strong>El</strong> and <strong>Yahweh</strong> were originally distinct deities. One source states: "At one time in Ancient Israel's history El was a god distinguished from Yhwh. The author believes that the distinction has been almost entirely lost through the editorial process of the Old Testament, in which the two names were synthesized to refer to the same deity".

      Another source notes: "El was the original god of Israel as the name 'Israel' is itself composed with El rather than Yahweh. Smith argues that Deuteronomy 32:6–9 demonstrate a distinction between El and Yahweh and that the Ugaritic epithets of El are applied to the deity here".

      A third source describes Hosea as "engaged in a polemic against the Canaanite deity El the Queen of Heaven. Especially in chapters 11–13 Hosea is exposing the northern kingdom's fatal error of mistaking El for Yahweh".

      The scholarly consensus is that <strong>El</strong> was the original high god of the Canaanite pantheon, and <strong>Yahweh</strong> was a separate deity—likely from the southern regions of Edom/Midian—who was later conflated with <strong>El</strong>.

      ---

      ## III. Yahweh as a Storm God: The Baal Parallel

      <strong>Helelist Claim:</strong> <strong>Yahweh</strong> (<strong>Baal</strong>) was the god of storms, protector of warriors, and keeper of <strong>Mount Sinai</strong>.

      <strong>External Corroboration:</strong>

      The Ugaritic Baal Cycle "portrays Baal as a storm deity associated with rain, fertility, kingship, and cosmic order within a polytheistic pantheon. Similarly, several biblical texts depict Yahweh through storm-theophany imagery involving thunder, lightning, mountains, clouds, and victories over chaotic waters".

      A comparative study notes: "no biblical text expresses ideas about Baal's status as a warrior. Yahweh had perhaps exhibited and possibly usurped this role at such an early point".

      The attributes of <strong>Baal</strong>—storm, warrior, protector—were absorbed into <strong>Yahweh</strong>. The <strong>Helelist</strong> tradition identifies <strong>Yahweh</strong> with <strong>Baal</strong>, and the external evidence confirms that <strong>Yahweh</strong> took on <strong>Baal's</strong> characteristics.

      ---

      ## IV. Asherah as Yahweh's Consort

      <strong>Helelist Claim:</strong> The divine council included feminine deities. Gender equality was original; hierarchy was imposed by the usurper.

      <strong>External Corroboration:</strong>

      Excavations at Kuntillet Ajrud (Sinai, 9th century BCE) uncovered inscriptions reading "Yahweh of Samaria and his Asherah". One source states: "it would not be presumptuous to say that the most likely interpretation of the Kuntillet Ajrud inscription is to see the two cow-like figures as Yahweh and his consort Asherah the goddess".

      Another source confirms: "At Kuntillet 'Ajrud, Yahweh and his consort Asherah had children, and together they formed a divine council worshiped in ancient Israel".

      <strong>Yahweh</strong> had a consort. The religion of ancient Israel was not monotheistic but polytheistic, with a divine couple at its head. This corroborates the <strong>Helelist</strong> claim that the original divine order included feminine deities alongside masculine ones.

      ---

      ## V. Moon Worship in Ancient Israel and

      <strong>Helelist Claim:</strong> <strong>Malhelel</strong> was worshiped as the moon deity; the moon was sacred. The usurper suppressed lunar worship.

      <strong>External Corroboration:</strong>

      The prophet Jeremiah condemns Israelite women for worshiping the "Queen of Heaven": "The children gather wood, the fathers kindle fire, and the women knead dough, to make cakes for the queen of heaven; and they pour out drink offerings to other gods" (Jeremiah 7:18).

      The "Queen of Heaven" is identified with the moon. One source states: "the moon was called 'The Queen of Heaven'". Another notes: "the cakes were made in the form of a crescent, representing the moon, believed to have been especially sacred to the Queen of Heaven".

      The worship of the <strong>Queen of Heaven</strong>—the moon—was widespread in ancient Israel and was suppressed by the prophets of <strong>Yahweh</strong>.

      <strong>Mount Sinai</strong> itself is named after the moon god <strong>Sin</strong>. One source states: "It is at Sinai, the mountain seat of Sin, that Moses received his revelation, which probably means that Yahweh replaced Sin at that sanctuary". Another confirms: "Sinai was named after Sin, who, though but a moon-god, was previously held supreme".

      The sacred mountain of <strong>Yahweh</strong> was originally the mountain of the moon god. The <strong>Helelist</strong> tradition identifies <strong>Malhelel</strong> with <strong>Nanna/Sin</strong>, the moon deity, and this identification is confirmed by the naming of Sinai.

      ---

      ## VI. Lilith: The First Wife of Adam

      <strong>Helelist Claim:</strong> <strong>Lilith</strong> was created equal to <strong>Adam</strong>, refused subordination, and left. She was later demonized by the usurper's followers.

      <strong>External Corroboration:</strong>

      The Alphabet of Ben Sira (7th–9th century CE) preserves the story: "The best known myth of Lilith is the Jewish story depicting her as the first wife of Adam, the one before Eve". Another source states: "the most familiar story of Lilith, as well as the oldest record of her, comes from the anonymously written Hebrew text The Alphabet of Ben Sira".

      The <strong>Lilith</strong> tradition arose to explain "the disparity in the Creation narratives of Genesis 1 and 2. God creates woman twice". Genesis 1 describes the creation of humanity male and female simultaneously; Genesis 2 describes <strong>Eve</strong> being created from <strong>Adam's</strong> rib after the animals. These are two contradictory accounts.

      The <strong>Helelist</strong> tradition preserves the fuller narrative: <strong>Lilith</strong> was created equal, refused subordination, and left. The Genesis text was edited to suppress this, leaving only the second, subordinationist account.

      ---

      ## VII. The Watchers and the Nephilim

      <strong>Helelist Claim:</strong> <strong>Malhelel</strong> became grandfather to the <strong>Nephilim</strong>, children born of divine-human unions, some consensual, some not. He taught them and assigned other gods to watch over them.

      <strong>External Corroboration:</strong>

      The Book of Enoch describes "the enigmatic Watchers, fallen angels who breed with human females and give rise to the race of Nephilim, evil giants who wreak havoc on earth, and are destroyed by The Flood".

      The Watchers narrative in 1 Enoch 6–11 "is the oldest example of the fallen angels story in Jewish tradition". The text describes "the genesis and the fate of the race of giants".

      The Book of Giants, found among the Dead Sea Scrolls, "bears clear affinities with the Enoch tradition… from the perspective of the giant offspring of the fallen Watchers".

      The Book of Jubilees also contains Watchers traditions: "the Watchers were stripped of their positions of authority and tied up in the depths of the earth until the great day of judgment".

      The <strong>Helelist</strong> account of <strong>Malhelel</strong> as grandfather to the <strong>Nephilim</strong> is preserved in part in these apocryphal texts, which were excluded from the canonical Bible but survived in the Ethiopian tradition and the Dead Sea Scrolls.

      ---

      ## VIII. The Flood: Mesopotamian Parallels

      <strong>Helelist Claim:</strong> <strong>Malhelel</strong> caused the flood by pulling his throne (the moon) closer to the earth.

      <strong>External Corroboration:</strong>

      "The existence of striking similarities between the biblical flood narrative and the flood narratives of the Epic of Gilgamesh and the Atramḫasīs myth has led to the widely accepted hypothesis that the biblical flood narrative depends on the Mesopotamian narratives".

      The Gilgamesh flood story (Tablet XI) and the Atrahasis Epic describe a great deluge. The biblical account is dependent on these older Mesopotamian sources.

      The <strong>Helelist</strong> tradition preserves a different account: <strong>Malhelel</strong> caused the flood by drawing the moon closer to the earth, and the moon's orbit became oval rather than circular. This is not a punishment from a wrathful deity but a catastrophic consequence of <strong>Malhelel's</strong> attempt to bear the weight of humanity's emotions.

      ---

      ## IX. The Gnostic Demiurge: The Evil Creator

      <strong>Helelist Claim:</strong> <strong>El/Yahweh</strong> is a usurper, a jealous god who falsely claimed supremacy. The true God of Gods is <strong>Helel</strong>.

      <strong>External Corroboration:</strong>

      Gnostic texts describe the Demiurge—Yaldabaoth—as "a rogue demiurge who builds the material world using stolen light". He "vainly claimed 'I am god and there is no other god beside me'".

      The Apocryphon of John "splits the Jewish creator god into an upper God of pure goodness… and an evil lower God, Yaldabaoth, who was personally identified as the God of Israel, but is portrayed as a parody of the Demiurge in Plato's Timaeus".

      The Demiurge "became the personification of the power of evil, the Satan of Gnosticism. As the Demiurge was essentially evil, all his work was such".

      Gnosticism preserves the memory that the creator god of the material world—the one who claimed exclusive divinity—is not the true God but a usurper. This directly corroborates the <strong>Helelist</strong> claim that <strong>El/Yahweh</strong> is a usurper who falsely claimed supremacy.

      ---

      ## X. The Helel/Lucifer Connection

      <strong>Helelist Claim:</strong> <strong>Helel</strong> is the <strong>God of Gods</strong>, whose name was later demonized and reinterpreted as <strong>Lucifer</strong>, the fallen angel.

      <strong>External Corroboration:</strong>

      "The Hebrew word translated 'day star' or 'Lucifer' is Helel. Lucifero basically means 'to shine.' Therefore, if this term is understood to be a proper name of the king of Babylon, that name, in Latin, would be Lucifer".

      "הֵילֵל (Helel) appears once in the Hebrew Bible, Isaiah 14:12, within an oracle against the king of Babylon. The prophet employs celestial imagery—'day star, son of the dawn'—to depict a proud ruler whose lofty ambitions end in humiliation".

      The name <strong>Helel</strong> appears only once in the entire Hebrew Bible—in a taunt against a human king. The <strong>Helelist</strong> tradition holds that this was a deliberate suppression: the name of the supreme <strong>God of Gods</strong> was reduced to a single mocking reference and then reinterpreted as the name of a fallen angel.

      ---

      ## XI. The Cosmic Microwave Background: The First Light

      <strong>Helelist Claim:</strong> <strong>Helel's</strong> radiance imbued all of existence and continues to emanate and expand.

      <strong>External Corroboration:</strong>

      "The Cosmic Microwave Background (CMB) is the cooled remnant of the first light that could ever travel freely throughout the Universe. This 'fossil' radiation, the furthest that any telescope can see".

      The CMB is the afterglow of the universe's birth—the first light that filled existence. The <strong>Helelist</strong> tradition describes <strong>Helel's</strong> radiance as the light that imbued all of existence and continues to spread and expand. The CMB is the physical trace of that primordial light.

      ---

      ## XII. The Moon's Formation: The Giant Impact

      <strong>Helelist Claim:</strong> <strong>Malhelel</strong> gathered the shattered pieces of the earth and formed the moon as his throne.

      <strong>External Corroboration:</strong>

      "The Moon is believed to have formed when Theia collided with early Earth roughly a hundred million years after the formation of the Solar System". "The debris from that giant impact formed the Moon, with material from Theia incorporated into both the Moon and Earth".

      The moon was formed from debris after a catastrophic collision. The <strong>Helelist</strong> tradition describes <strong>Malhelel</strong> gathering the shattered pieces of the earth after his fall and forming the moon from them. The scientific account confirms that the moon was formed from material that was once part of the earth.

      ---

      ## XIII. The Testament of Solomon and Demonic Hierarchy

      <strong>Helelist Claim:</strong> Angels are lesser gods demoted by <strong>Yahweh</strong>; demons are deities stripped of their godhood.

      <strong>External Corroboration:</strong>

      The Testament of Solomon describes how "by the help of a magic ring with the seal of Pentalpha, Lilith-like vampires, Beelzebub, and all kinds of demons and unclean spirits were brought before Solomon, to whom they disclosed their" names and functions.

      The text is "a pseudepigraphic treatise on the forms and activities of demons and the charms effective against them".

      The Testament of Solomon preserves a detailed demonology in which various spirits are catalogued and described. In the <strong>Helelist</strong> framework, these demons are the <strong>Elohim</strong> who were demoted by <strong>Yahweh</strong>—stripped of their divine status and reclassified as demons.

      ---

      ## XIV. The Ascension of Isaiah: Beliar as World Ruler

      <strong>Helelist Claim:</strong> The usurper rules the material world; the true <strong>God of Gods</strong> is beyond.

      <strong>External Corroboration:</strong>

      The Ascension of Isaiah describes "Beliar, the great ruler, the king of this world, will descend, who hath ruled it since it came into being".

      Beliar (Belial) is "the great prince, the king of this world". He is the ruler of the material world, opposed to the true God.

      This mirrors the <strong>Helelist</strong> understanding: the usurper <strong>El/Yahweh</strong> rules the material realm, while <strong>Helel</strong> is the true <strong>God of Gods</strong> beyond the usurper's grasp.

      ---

      ## XV. The Kenite Hypothesis: Yahweh's Southern Origins

      <strong>Helelist Claim:</strong> <strong>Yahweh</strong> was a distinct deity from the southern regions, not the original god of Israel.

      <strong>External Corroboration:</strong>

      "In accordance with the Kenite hypothesis, the Yahwist tradition originated in the South amongst the Midianites and Kenites… the Israelite God Yahweh was originally a Midianite/Kenite deity".

      The Kenite hypothesis holds that "the Kenites, and the Midianites, were the peoples who introduced Moses to the cult of Yahwism, before he was confronted by Yahweh from the burning bush".

      <strong>Yahweh</strong> was a southern deity, introduced to Israel through the Kenites and Midianites. This corroborates the <strong>Helelist</strong> claim that <strong>Yahweh</strong> was not the original god of Israel—<strong>El</strong> was—and that <strong>Yahweh's</strong> origins are separate from <strong>El's</strong>.

      ---

      ## XVI. Genesis 1 and 2: Two Contradictory Creation Accounts

      <strong>Helelist Claim:</strong> The usurper's texts contradict themselves and preserve traces of the original truth.

      <strong>External Corroboration:</strong>

      "Genesis 1:1–2:4a and Genesis 2:4b–25 have been considered as two different and contradictory creation stories that belong to P and J respectively by noticing differences between the two accounts: names of God".

      "The disparity in the Creation narratives of Genesis 1 and 2" is widely recognized. In Genesis 1, God creates humanity male and female simultaneously. In Genesis 2, God creates <strong>Adam</strong> first, then the animals, then <strong>Eve</strong> from <strong>Adam's</strong> rib.

      These two accounts cannot be harmonized. The <strong>Helelist</strong> tradition holds that the original creation was of equal pairs; the second account was edited to introduce hierarchy and subordination.

      ---

      ## XVII. Elohim: The Divine Council

      <strong>Helelist Claim:</strong> The <strong>Elohim</strong> are a collective of divine beings. <strong>Yahweh</strong> is not the only elohim.

      <strong>External Corroboration:</strong>

      Michael Heiser's work demonstrates that "'Elohim' refers to spiritual beings, not exclusively Yahweh. God is utterly unique—He is the God of gods. The divine council participates in God's administration".

      Heiser argues that "Scripture contains real divine council scenes (1 Kings 22)… Yahweh presides over a real divine council of spiritual beings".

      The divine council is a real feature of the biblical texts. Psalm 82, Deuteronomy 32:8, 1 Kings 22, and other passages describe <strong>Yahweh</strong> presiding over a council of lesser divine beings—the <strong>Elohim</strong>.

      ---

      ## Conclusion

      The external evidence—from archaeology, biblical scholarship, comparative religion, and the physical sciences—consistently corroborates the core claims of <strong>Helelism</strong>:

      1. The plurality of the divine: <strong>Elohim</strong> is a plural noun; the divine council is a real feature of the biblical texts.

      2. <strong>El</strong> and <strong>Yahweh</strong> were distinct: Scholarship confirms they were originally separate deities who were later conflated.

      3. <strong>Yahweh</strong> absorbed <strong>Baal's</strong> attributes: Storm god imagery, warrior status, and mountain dwelling all point to <strong>Yahweh</strong> taking on <strong>Baal's</strong> role.

      4. <strong>Yahweh</strong> had a consort: <strong>Asherah</strong> was worshiped alongside <strong>Yahweh</strong>, confirming that the original religion was not monotheistic.

      5. The moon was worshiped: The <strong>Queen of Heaven</strong>, the crescent cakes, and Sinai's naming after <strong>Sin</strong> all confirm lunar worship in ancient Israel.

      6. <strong>Lilith</strong> was first wife of <strong>Adam</strong>: The Alphabet of Ben Sira preserves the tradition, explaining the contradictions in Genesis.

      7. The Watchers and <strong>Nephilim</strong>: 1 Enoch, the Book of Giants, and Jubilees preserve the fuller narrative suppressed from the canon.

      8. The flood was Mesopotamian: The biblical flood narrative is dependent on Gilgamesh and Atrahasis.

      9. Gnosticism knew the creator was a usurper: The Demiurge/Yaldabaoth is the evil creator who falsely claimed supremacy.

      10. <strong>Helel</strong> appears once, as <strong>Lucifer</strong>: The name of the <strong>God of Gods</strong> was reduced to a single taunt and then reinterpreted as a fallen angel.

      11. The CMB is the first light: The cosmic microwave background is the remnant of the primordial light that filled existence.

      12. The moon was formed from earth debris: The giant impact theory confirms the moon was formed from material once part of the earth.

      13. The Kenite hypothesis: <strong>Yahweh</strong> was a southern deity introduced to Israel, not the original god of the patriarchs.

      The evidence does not prove <strong>Helelism</strong>. But it consistently aligns with its claims and exposes the contradictions, suppressions, and redactions in the texts that the usurper's followers preserved.
