      # The Arelik Language: A Complete Dossier

      This dossier compiles all attested information about the Arelik language from surviving inscriptions, family records, and oral traditions. It is organized as a reference document for those seeking to read, write, and understand Arelik.

      ---

      ## Part One: The Arelik Script

      ### 1.1 Overview

      The Arelik script consists of 24 characters. Twenty-two characters correspond to the Imperial Aramaic alphabet, with two additional characters unique to Arelik.

      \*\*Script characteristics:\*\*

      - Written left to right

      - Fluid, cursive style

      - Tighter spacing between characters than Aramaic

      - Some characters are written with multiple strokes

      - Sacred inscriptions may be arranged for "moon view" (to be read from above)

      \*\*Source:\*\* Description of the Arelik script based on surviving inscriptions and oral tradition. 📖

      ---

      ### 1.2 The Arelik Alphabet

      | # | Name | Sound | Shape Description |

      |---|---|---|---|

      | 1 | Aleph | /ʔ/ or vowel carrier | Plus sign (+) with wavy horizontal stroke, ends nearly enclosed |

      | 2 | Beth | /b/ | Resembles Arabic خ with bottom curve curving right; compressed > with dot above |

      | 3 | Gimel | /ɡ/ | Upside-down version of Armenian letter հ |

      | 4 | Daleth | /d/ | Armenian letter ի mirrored then flipped upside down; resembles կ with smaller hook and larger line |

      | 5 | He | /h/ | Single stroke like J; bottom swoop crosses over, goes up then down; resembles hiragana み |

      | 6 | Waw | /w/ or /uː/, /oː/ | Resembles Arabic ى vertically squished; derived from Arabic م with extra line and flipped |

      | 7 | Zayin | /z/ | Hebrew/Aramaic ז upside down (notch at bottom); looks like lowercase L |

      | 8 | Heth | /ħ/ | Resembles Hebrew ה with curved part like ל; overall looks like ל + ו combined |

      | 9 | Teth | /tˤ/ | Exactly like Tai Viet character ꪆ; also resembles upside-down capital G or Arabic و |

      | 10 | Yodh | /j/ or /iː/, /eː/ | Apostrophe-like stroke |

      | 11 | Kaph | /k/ | Like number 4 (open style) with vertical stroke curving down like y; resembles ㄴ + ل combined |

      | 12 | Lamedh | /l/ | Cursive capital L; italic stroke curving into swoop before bottom |

      | 13 | Mem | /m/ | Single-stroke derived from Aramaic 𐡌 with vertical connector at top; like a '5' with crossing |

      | 14 | Nun | /n/ | Like Balinese character ᭪ but with flat top (horizontal) instead of round |

      | 15 | Samekh | /s/ | Resembles a reversed '3' with wavy bottom; derived from Arabic ﻉ with longer wavy bottom and reversed |

      | 16 | Ayin | /ʕ/ | Mirror image of Arabic connected form ٮں |

      | 17 | Pe | /p/ | One-stroke box-like shape: top-left small vertical, top horizontal right, right vertical down, bottom curve down-left; resembles ל but boxed |

      | 18 | Sade | /sˤ/ | Exactly the Armenian letter խ |

      | 19 | Qoph | /q/ | Curved capital A on its side; or capital D with vertical stroke extending out, with ends of curve also extending |

      | 20 | Resh | /r/ | Like letter Y in two strokes; upper stroke boxy/angular, crossing through vertical of bottom stroke |

      | 21 | Shin | /ʃ/ | Derived from Hebrew ש: first two notches merged; second notch extended past bottom curve; resembles upside-down め without one extended notch |

      | 22 | Taw | /t/ | Like number 7 with a dot below the upper notch; looks like .ד |

      | 23 | A'an (extra) | /ʔ/ or vowel | Cursive Y (looped tail) with bottom curve returning up symmetrically; resembles Greek ψ in one stroke |

      | 24 | H' (extra) | /h/ | Reverse of Armenian capital Ը, with bottom stroke curved down left (like Arelik pe) |

      \*\*Source:\*\* Character descriptions provided from the Arelik script as preserved in sacred inscriptions. 📖

      ---

      ### 1.3 Key Distinctions

      #### Teth vs. Taw

      | Letter | Sound | Description |

      |---|---|---|

      | Teth (9) | /tˤ/ | Emphatic /t/ — pronounced with tongue pulled back and pharynx constricted (like Arabic ط) |

      | Taw (22) | /t/ | Plain /t/ — regular voiceless dental/alveolar plosive (like English "t") |

      #### Sibilants

      | Letter | Sound | Description |

      |---|---|---|

      | Samekh (15) | /s/ | Plain voiceless alveolar fricative (like English "s") |

      | Sade (18) | /sˤ/ | Emphatic /s/ — pharyngealized (like Arabic ص) |

      | Shin (21) | /ʃ/ | Voiceless postalveolar fricative (like English "sh") |

      \*\*Source:\*\* Phonetic distinctions based on Semitic sound patterns and tradition. 📖

      ---

      ## Part Two: Arelik Vocabulary

      ### 2.1 Divine Names and Titles

      | Arelik | English | Etymology |

      |---|---|---|

      | Helel | The God of Gods | Ha-El-El — "the God of Gods" |

      | Malhelel | Appointed by Helel | Mal (from Malku'eli, "bestowed by God") + Helel |

      | Melh'edu | Throne of the Moon | Mel- (from malku, "king/ruler") + h'edu (root related to "witness") |

      | K'inati | God of jealousy, beauty, envy | Semitic root q-n-ʾ ("to be jealous, zealous") |

      | Yahweh | Androgynous child of K'inati | Of uncertain origin |

      | El | God | Common Semitic word for deity |

      | Menori | Existence | Ge'ez መኖር (mänor) — "existence, dwelling" |

      | Khešmeli | Goddess of love, hatred, emotions | Aramaic root ḥ-š-š ("to feel, sense") + -eli ("my God") |

      | MelŠarru | Goddess of infinite potential, chaos | Mel- (from malku) + Šarru (Akkadian for "king") |

      | Ša'atul | God of souls and consequences | Aramaic ša'at ("hour, time") + -ul |

      | Šamšā | God of Justice, caretaker of cosmos | Aramaic šamšā ("sun") |

      | H'Atemi | Goddess of truth made manifest | Aramaic h' + 'atem ("to be true") |

      | 'Esṭrōnōmā | Guardian, carved the four rivers | Greek astronomia ("astronomy") |

      \*\*Source:\*\* Divine names from Helelist sacred texts. 📖

      ---

      ### 2.2 Theological and Philosophical Terms

      | Arelik | English | Etymology |

      |---|---|---|

      | Tarersetu | The place of return to the source | Tar ("to return, go to source") + Ersetu ("place, land") |

      | Idayn Ha'akium | The Epoch of Existence | Idayn ("epoch, age") + Ha'akium ("the Existence") |

      | Ha'akium | The Existence | Ha- (definite article) + akium ("existence") |

      | Rik | Void, empty | Aramaic rīq ("empty, void") |

      | Hoshets | Darkness, chaos | Related to Hebrew ḥoshekh ("darkness") |

      | Netol Klom | Devoid of anything | Netol (Aramaic n-ṭ-l, "to take") + Klom (kol + -m, "all/everything") |

      | Tod'a | Consciousness, knowledge | Aramaic tôd'ā ("knowledge, awareness") |

      | Ki'ina | Jealousy | Derived from K'inati's name |

      | Hōb / Khob(a) | Sin (imposed name) | Semitic root ḥ-w-b ("debt, obligation, guilt") |

      \*\*Source:\*\* Theological terminology from the Epoch of Existence and sacred hymns. 📖

      ---

      ### 2.3 Place Names

      | Arelik | English | Etymology |

      |---|---|---|

      | Arelia | Ancestral homeland | Associated with A' Yarikha (Jericho); possibly from A'Yarikha → Ayaria → Aralia → Arelia |

      | A' Yarikha | Jericho (Moon City) | A' (definite article) + Yarikha (from Yarikh, moon god) |

      | Kish | Ancient Mesopotamian city | Sumerian name; in tradition, birthplace of all kings |

      | Har Yarikha | Mount Sinai (Mountain of the Moon) | Har ("mountain") + Yarikha ("moon") |

      | Harsag Šin | Mount Sinai (Sumerian) | Harsag ("mountain") + Šin (moon god Sin) |

      \*\*Source:\*\* Place names from Helelist sacred texts and traditions. 📖

      ---

      ### 2.4 Religious Practices and Concepts

      | Arelik | English | Etymology |

      |---|---|---|

      | Mors Non est Finis | Death is not the end | Latin phrase |

      | Kursyā d-Sahrā | Throne of the Moon | Aramaic kursyā ("throne") + d- ("of") + Sahrā ("moon") |

      | Pagumē | 13th month of Ethiopian calendar | Ge'ez ጳጉሜን (Pagumēn) |

      \*\*Source:\*\* Religious terminology from Helelist practices. 📖

