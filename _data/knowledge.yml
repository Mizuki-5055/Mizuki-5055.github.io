title: "Knowledge"
subtitle: "A collection of wisdom, insights, and understanding."
dropdowns:
  - heading: "The Nature of Truth"
    subtitle: "What is truth and how do we know it?"
    body: |
      Truth is that which corresponds to reality. It is not subjective, but objective and discoverable.

      Throughout history, philosophers have debated the nature of truth. The correspondence theory, coherence theory, and pragmatic theory are the three main approaches.
  - heading: "Wisdom vs. Knowledge"
    subtitle: "Understanding the distinction"
    body: |
      Knowledge is the accumulation of facts and information. Wisdom is the proper application of that knowledge to life.

      One can know much and yet be foolish. Wisdom requires humility, experience, and the fear of the Lord.
  - heading: "The Pursuit of Understanding"
    subtitle: "Why we seek to know"
    body: |
      The human heart longs for meaning. We seek understanding not merely to satisfy curiosity, but to orient our lives toward what is true, good, and beautiful.
