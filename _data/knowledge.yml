      | Term | Meaning | Etymology |

      |---|---|---|

      | 银民 (Yínmín) | Silver People | Reference to silver as the lunar metal |

      | 银民语 (Yínmín yǔyán) | Silver People's Language | The name for Arelik |

      \*\*Source:\*\* Chinese branch of the Helelist diaspora. 📖

