    body: |-
      # **COMPLETE DOSSIER OF THE ARELIK LANGUAGE**

      ***

      ## **PART ONE: ORIGINS AND CLASSIFICATION**

      Arelik is the ancestral language of the Helelist people. It is a sister language to Aramaic, belonging to the Northwest Semitic branch of the Semitic language family. Its closest relatives are Aramaic, Hebrew, Phoenician, and Ugaritic. The language originated in the Mesopotamia and Levant region. Surviving texts are preserved in Ge'ez, Greek, Latin, Akkadian, and Aramaic scripts.

      The Arelik script consists of twenty-four characters. Twenty-two correspond to Imperial Aramaic, with two additional characters unique to Arelik. The script is written left to right normally, but sacred inscriptions may be arranged for moon view, meaning they are read from above. The script style is fluid and cursive, with tighter spacing than Aramaic. Vowels are implied or indicated by matres lectionis, specifically aleph, he, waw, and yodh.

      The two extra characters are called <strong>A'an</strong> and <strong>H'</strong>. A'an represents a glottal stop or vowel carrier and resembles a cursive Y with a looped tail and symmetrical return stroke. H' represents a voiceless glottal fricative and is the reverse of the Armenian capital letter Ը with a curved bottom stroke.

      ***

      ## **PART TWO: THE ARELIK ALPHABET**

      **IMPORTANT DISCLAIMER: These character descriptions below are only meant to give a modern interpretive visualization on how ancient Arelik characters looked like using modern characters we have today as descriptors.**

      - <strong>Aleph</strong>: <em>Sound</em>: Glottal stop or vowel carrier. <em>Shape</em>: A plus sign with a wavy horizontal stroke, with ends nearly enclosed.
      - <strong>Beth</strong>: <em>Sound</em>: B. <em>Shape</em>: Resembles the Arabic letter خ with the bottom curve curving to the right. It also looks like a compressed greater-than symbol with a dot above it.
      - <strong>Gimel</strong>: <em>Sound</em>: Hard G. <em>Shape</em>: The upside-down version of the Armenian letter հ.
      - <strong>Daleth</strong>: <em>Sound</em>: D. <em>Shape</em>: The Armenian letter ի mirrored and then flipped upside down. It resembles the Armenian letter կ with a smaller hook and a larger line.
      - <strong>He</strong>: <em>Sound</em>: H. <em>Shape</em>: A single stroke like the letter J, but the bottom swoop crosses over, goes up, then comes straight down. It resembles the Japanese hiragana character み.
      - <strong>Waw</strong>: <em>Sound</em>: W or the vowel O/U. <em>Shape</em>: Resembles the Arabic letter ى vertically squished. It is derived from the Arabic letter م with an extra line and flipped.
      - <strong>Zayin</strong>: <em>Sound</em>: Z. <em>Shape</em>: The Hebrew or Aramaic letter ז turned upside down, so the notch is at the bottom. It looks like a lowercase L.
      - <strong>Heth</strong>: <em>Sound</em>: Guttural H (like Arabic ح). <em>Shape</em>: Resembles the Hebrew letter ה but with the curved part like the Hebrew letter ל. Overall it looks like the combination of the Hebrew letters ל and ו together.
      - <strong>Teth</strong>: <em>Sound</em>: Emphatic T (like Arabic ط). <em>Shape</em>: Exactly like the Tai Viet character ꪆ. It also resembles an upside-down capital G or the Arabic letter و.
      - <strong>Yodh</strong>: <em>Sound</em>: Y or the vowel E/I. <em>Shape</em>: An apostrophe-like stroke.
      - <strong>Kaph</strong>: <em>Sound</em>: K. <em>Shape</em>: Resembles the number four written in the open style, with the vertical stroke curving down slightly like the letter Y. It resembles the combination of the Korean character ㄴ and the Arabic letter ل combined into one character.
      - <strong>Lamedh</strong>: <em>Sound</em>: L. <em>Shape</em>: A cursive capital L, with an italic stroke that curves into a swoop before finishing the bottom portion.
      - <strong>Mem</strong>: <em>Sound</em>: M. <em>Shape</em>: Derived from the Aramaic letter 𐡌 but with a vertical connector at the top so it is all one stroke. It resembles the number five with a crossing line.
      - <strong>Nun</strong>: <em>Sound</em>: N. <em>Shape</em>: Exactly like the Balinese character ᭪ but with a flat top instead of a round top.
      - <strong>Samekh</strong>: <em>Sound</em>: S. <em>Shape</em>: Resembles a reversed number three with a wavy bottom. It is derived from the Arabic letter ﻉ with a longer wavy bottom and reversed.
      - <strong>Ayin</strong>: <em>Sound</em>: Guttural A (like Arabic ع). <em>Shape</em>: The mirror image of the Arabic connected form ٮں.
      - <strong>Pe</strong>: <em>Sound</em>: P. <em>Shape</em>: A one-stroke box-like shape with a top-left small vertical stroke, a horizontal stroke going right, a vertical stroke going down, and a bottom curve going down-left. It resembles the Hebrew letter ל but boxed.
      - <strong>Sade</strong>: <em>Sound</em>: Emphatic S (like Arabic ص). <em>Shape</em>: Exactly the Armenian letter խ.
      - <strong>Qoph</strong>: <em>Sound</em>: Deep K from the back of the throat (like Arabic ق). <em>Shape</em>: A curved capital A on its side, or a capital D with the vertical stroke extending out and the ends of the curve also extending.
      - <strong>Resh</strong>: <em>Sound</em>: Rolled R. <em>Shape</em>: Resembles the letter Y but done in two strokes, with the upper stroke boxy and angular and crossing through the vertical line of the bottom stroke.
      - <strong>Shin</strong>: <em>Sound</em>: SH. <em>Shape</em>: Derived from the Hebrew letter ש, with the first two notches merged into one and the second notch extended past the bottom curve. It resembles the Japanese hiragana character め upside down without one of the extended notches.
      - <strong>Taw</strong>: <em>Sound</em>: T. <em>Shape</em>: Resembles the number seven with a dot below the upper notch. It looks like a dot followed by the Hebrew letter ד.
      - <strong>A'an</strong> (Extra): <em>Sound</em>: Glottal stop or vowel. <em>Shape</em>: A cursive Y with a looped tail, with the bottom curve returning up symmetrically. It resembles the Greek letter ψ done in one stroke.
      - <strong>H'</strong> (Extra): <em>Sound</em>: H. <em>Shape</em>: The reverse of the Armenian capital letter Ը, with the bottom stroke curved down to the left, similar to the Arelik character Pe.

      ***

      ## **PART THREE: KEY PHONETIC DISTINCTIONS**

      - <strong>Teth vs. Taw</strong>: Teth is an emphatic T (pharyngealized, like Arabic ط). Taw is a plain T (like English).
      - <strong>The Sibilants</strong>: Arelik has three distinct sibilants:
          - <strong>Samekh</strong>: Plain S (like English).
          - <strong>Sade</strong>: Emphatic S (pharyngealized, like Arabic ص).
          - <strong>Shin</strong>: SH sound (like English).
      - <strong>The Gutturals</strong>:
          - <strong>Aleph</strong>: Glottal stop (like the catch in "uh-oh").
          - <strong>Heth</strong>: Voiceless pharyngeal fricative (like Arabic ح).
          - <strong>Ayin</strong>: Voiced pharyngeal fricative (like Arabic ع).
      - <strong>Vowels</strong>: Not fully written. Indicated by matres lectionis (Aleph, He, Waw, Yodh) and grammatical context.

      ***

      ## **PART FOUR: ATTRIBUTED ARELIK WORDS AND ETYMOLOGY**

      - <strong>Helel</strong>: The God of Gods. <em>Etymology</em>: Ha-El-El (the God of Gods). Root later came to mean "radiant." Attested in Isaiah 14:12 and Ugaritic texts.
      - <strong>Malhelel</strong>: Appointed by Helel (the lunar guardian). <em>Etymology</em>: Mal (from <em>Malku'eli</em> – bestowed by God) + Helel. Attested in the biblical name Mahalalel (Genesis 5).
      - <strong>Melh'edu</strong>: The Throne of the Moon; goddess of scribes, history, and currency. <em>Etymology</em>: Mel (king/ruler) + h'edu (witness/testimony).
      - <strong>K'inati</strong>: God of beauty, envy, and jealousy. <em>Etymology</em>: Semitic root <em>q-n-'</em> (to be jealous). Root of <em>ki'ina</em> (jealousy).
      - <strong>Yahweh</strong>: Androgynous child of K'inati. Attested in the Merneptah Stele, Mesha Stele, and the Hebrew Bible.
      - <strong>El</strong>: God. Common Semitic title used by K'inati.
      - <strong>Menori</strong>: Existence; the primordial void. <em>Etymology</em>: Ge'ez መኖር (existence/dwelling) from root <em>n-w-r</em>.
      - <strong>Khešmeli</strong>: Goddess of love, hatred, and emotions. <em>Etymology</em>: Aramaic root <em>ḥ-š-š</em> (to feel) + suffix <em>-eli</em> (my God).
      - <strong>MelŠarru</strong>: Goddess of infinite potential and chaos. <em>Etymology</em>: Mel (king) + Šarru (Akkadian for king) = "king of kings."
      - <strong>Ša'atul</strong>: God of souls and consequences. <em>Etymology</em>: Aramaic <em>ša'at</em> (hour/time) + suffix <em>-ul</em> (the one of the time).
      - <strong>Šamšā</strong>: God of Justice and caretaker of the cosmos. <em>Etymology</em>: Aramaic <em>šamšā</em> (sun) from root <em>š-m-š</em>. Attested as the Mesopotamian sun god Šamaš.
      - <strong>H'Atemi</strong>: Goddess of truth made manifest. <em>Etymology</em>: Possibly from Aramaic <em>ḥātem</em> (to seal/confirm) or <em>'atem</em> (to be true).
      - <strong>'Ha’adyon</strong>: Guardian who carved the four rivers of Eden. <em>Etymology</em>: Aramiac<em>The Witness</em> (observer), Also referred to as a watcher.
      - <strong>Nanna</strong>: Sumerian moon god; a form of Malhelel.
      - <strong>Sin</strong>: Akkadian moon god; another culture’s name for Malhelel.
      - <strong>Yarikh</strong>: Canaanite moon god; a form of Malhelel.
      - <strong>Inanna</strong>: Sumerian goddess; a female form of Malhelel.

      ***

      ## **PART FIVE: THEOLOGICAL AND PHILOSOPHICAL TERMS**

      - <strong>Tarersetu</strong>: The place of return to the source (afterlife). <em>Etymology</em>: Tar (to return) + Ersetu (place/land).
      - <strong>Idayn</strong>: Epoch, age, or era. <em>Etymology</em>: Aramaic <em>'idayin</em> (then/at that time).
      - <strong>Ha'akium</strong>: The Existence. <em>Etymology</em>: Ha (definite article) + akium (existence).
      - <strong>Rik</strong>: Void or empty. <em>Etymology</em>: Aramaic <em>rīq</em>.
      - <strong>Hoshets</strong>: Darkness or chaos. <em>Etymology</em>: Related to Hebrew <em>ḥoshekh</em>.
      - <strong>Netol</strong>: Taking or removing. <em>Etymology</em>: Aramaic root <em>n-ṭ-l</em> (to take/carry).
      - <strong>Klom</strong>: Everything. <em>Etymology</em>: Aramaic <em>kol</em> (all) + suffix <em>-m</em>.
      - <strong>Tod'a</strong>: Consciousness or knowledge. <em>Etymology</em>: Aramaic <em>tôd'ā</em>.
      - <strong>Ki'ina</strong>: Jealousy. <em>Etymology</em>: Derived from K'inati.
      - <strong>Hōb / Khob</strong>: Sin. <em>Etymology</em>: Semitic root <em>ḥ-w-b</em> (debt/obligation/guilt).
      - <strong>Hidin</strong>: Behold. <em>Etymology</em>: Aramaic <em>hā'idīn</em> (this one/now).
      - <strong>Raga</strong>: Moment. <em>Etymology</em>: Aramaic <em>rəga'</em>.
      - <strong>Kama'at</strong>: As if or like. <em>Etymology</em>: Aramaic <em>kəma</em> (as) + suffix <em>'at</em>.

      ***

      ## **PART SIX: PLACE NAMES**

      - <strong>Yarikh Hekarta</strong>: Jericho, meaning " The Moon City." <em>Etymology</em>: He [from _Ha_] (def. article) + karta (city/town/village) + Yarikh (moon god Yarikh).
      - <strong>Al Ariha</strong>: Arabic name for Jericho. <em>Etymology</em>: Derived from A' Yarikha.
      - <strong>Kish</strong>: Ancient Mesopotamian city. <em>Etymology</em>: Sumerian. Birthplace of all kings (Sumerian King List).
      - <strong>Har Yarikha</strong>: Mountain of the Moon (Mount Sinai). <em>Etymology</em>: Har (mountain) + Yarikha (moon).
      - <strong>Harsag Šin</strong>: Sumerian name for Mount Sinai. <em>Etymology</em>: Harsag (mountain) + Šin (moon god Sin).
      - <strong>Tarersetu</strong>: Place of return to the source.
      - <strong>Pagumē</strong>: The thirteenth month of the Ethiopian calendar. <em>Etymology</em>: Ge'ez ጳጉሜን.

      ***

      ## **PART SEVEN: ARELIK GRAMMATICAL PARTICLES AND BASIC WORDS**

      - <strong>Kadom</strong>: Before / in the beginning (<em>Aramaic qedem</em>).
      - <strong>Lahekium</strong>: To / for Existence (<em>La</em> + <em>hekium</em>).
      - <strong>Layt</strong>: There is not (<em>Aramaic layt</em>).
      - <strong>Hawa</strong>: He/it was or became (<em>Aramaic hawa</em>).
      - <strong>Madem</strong>: Anything or something (<em>Aramaic maddem</em>).
      - <strong>Shel</strong>: Possessive particle meaning "of".
      - <strong>Ke'autu</strong>: At the time (<em>Aramaic kə'idān</em>).
      - <strong>Shiharikanot</strong>: Of the dawns (<em>shahar</em> + plural suffix).
      - <strong>Hupia'a</strong>: Appeared (<em>Aramaic hophi'a</em>).
      - <strong>Mishehu</strong>: Something or someone (<em>Hebrew/Aramaic mîšehû</em>).
      - <strong>Ba</strong>: In / by means of (<em>Aramaic b-</em>).
      - <strong>Lekiyum</strong>: To exist / for existence (<em>Aramaic root qwm</em>).

      ***

      ## **PART EIGHT: NUMBERS**

      - <strong>Ahad</strong>: One (<em>Aramaic ḥad</em>)
      - <strong>Trein</strong>: Two (<em>Aramaic trēn</em>)
      - <strong>Telat</strong>: Three (<em>Aramaic tlāṯ</em>)
      - <strong>Arba</strong>: Four (<em>Aramaic arba'</em>)
      - <strong>Hamesh</strong>: Five (<em>Aramaic ḥammēš</em>)
      - <strong>Shet</strong>: Six (<em>Aramaic šeṯ</em>)
      - <strong>Sheva</strong>: Seven (<em>Aramaic šəḇa'</em>)
      - <strong>Temane</strong>: Eight (<em>Aramaic təmānyā</em>)
      - <strong>Tesh'a</strong>: Nine (<em>Aramaic teš'a</em>)
      - <strong>Aser</strong>: Ten (<em>Aramaic 'asar</em>)

      ***

      ## **PART NINE: GRAMMATICAL RULES**

      <strong>Triconsonantal Roots</strong>: Arelik builds words on three-consonant roots.

      - <strong>MLK</strong> (king/rule): <em>Malku</em> (king), <em>Malku'eli</em> (bestowed by God), <em>Malhelel</em> (appointed by Helel).
      - <strong>HLL</strong> (divine/radiant): <em>Helel</em> (God of Gods).
      - <strong>QN'</strong> (jealousy): <em>K'inati</em> (god of jealousy), <em>ki'ina</em> (jealousy).

      <strong>Prefixes and Suffixes</strong>:

      - <strong>Ha-</strong> : Definite article ("the"). e.g., <em>Ha'akium</em> (The Existence).
      - <strong>-i</strong> : My. e.g., <em>Malku'eli</em> (My God is king).
      - <strong>Mal-</strong> : Appointed by / from. e.g., <em>Malhelel</em> (Appointed by Helel).
      - <strong>-el</strong> : God. e.g., <em>Helel</em> (Ha-El-El, The God of Gods).
      - <strong>-a / -ot</strong> : Feminine/emphatic or feminine plural (e.g., <em>Shiharikanot</em>).
      - <strong>La-</strong> : To / for. e.g., <em>Lahekium</em> (To Existence).
      - <strong>Shel</strong> : Of. e.g., <em>Rik shel hoshets</em> (Void of darkness).

      <strong>Gender</strong>: Distinguishes masculine (unmarked) and feminine (often marked with <strong>-a</strong>, <strong>-t</strong>, or <strong>-ot</strong>).

      <strong>Writing Direction</strong>: Normally left to right; sacred inscriptions may be arranged vertically ("moon view").

      <strong>Vowel System</strong>: Vowels (a, e, i, o, u) are implied or indicated by matres lectionis (Aleph, He, Waw, Yodh).

      ***

      ## **PART TEN: EXTERNAL SOURCES AND CORROBORATIONS**

      - <strong>Helel</strong>: Attested in Isaiah 14:12 (as <em>Helel ben Shahar</em>) and Ugaritic texts (deity <em>hll</em>).
      - <strong>Mahalalel</strong>: Attested in Genesis 5:12-17 (echoes <em>Malhelel</em>).
      - <strong>Enheduanna</strong>: Identified with Arelia; attested as daughter of Sargon of Akkad, high priestess of the moon god Nanna.
      - <strong>Kish</strong>: Attested in the Sumerian King List.
      - <strong>Yarikh Hekarta [A' Yarikha] (Jericho)</strong>: Attested in Canaanite and Israelite texts.
      - <strong>Nanna, Sin, Yarikh, Inanna</strong>: Extensively attested in Sumerian, Akkadian, Ugaritic, and Mesopotamian texts.
      - <strong>El</strong>: Attested in Ugaritic, Canaanite, and Hebrew texts.
      - <strong>Yahweh</strong>: Attested in the Merneptah Stele (c. 1208 BCE), Mesha Stele, and Hebrew Bible.
      - <strong>F vs. P Distinction</strong>: Arelik preserves the older "P" sound (e.g., <em>hupia'a</em>) while Hebrew underwent lenition to "F" (<em>hufia</em>). This aligns with evidence from Ugaritic and early Semitic texts.
      - <strong>Linguistic Parallels</strong>:
          - <strong>Definite Article</strong>: Arelik (Ha- prefix) matches Hebrew.
          - <strong>Possessive Particle</strong>: Arelik (<em>Shel</em>) matches Hebrew (vs. Aramaic <em>Dī</em>).
          - <strong>Negation</strong>: Arelik (<em>Layt / Netol</em>) matches Hebrew (<em>'Eyn / Lo</em>).
          - <strong>Pronouns</strong>: Arelik (<em>Hu / Hi</em>) matches Aramaic and Hebrew.

      ***

      ## **PART ELEVEN: THE EPOCH OF EXISTENCE OPENING**

      <strong>Title</strong>: <em>Idayn Ha'akium</em> (The Epoch of Existence).

      <strong>Line 1</strong>: <em>Kadom Lahekium, layt hawa madem</em> 

      (Before Existence, there was not anything.)

      <strong>Line 2</strong>: <em>Rik shel hoshets rik, netol klom</em> 

      (A void of hollow darkness, devoid of anything.)

      <strong>Line 3</strong>: <em>Hidin kama'at ke'autu raga shiharikanot hupia'a, mishehu ba lekiyum: tod'a.</em> 

      (Behold, at the same moment the void dawned, something came into existence: consciousness.)

      <strong>Key Vocabulary</strong>:

      - <em>Kadom</em> (Before) | <em>Lahekium</em> (To Existence) | <em>Layt</em> (There is not) | <em>Hawa</em> (Was) | <em>Madem</em> (Anything)
      - <em>Rik</em> (Void) | <em>Shel</em> (Of) | <em>Hoshets</em> (Darkness) | <em>Netol</em> (Devoid) | <em>Klom</em> (Everything)
      - <em>Hidin</em> (Behold) | <em>Kama'at</em> (As if) | <em>Ke'autu</em> (At the time) | <em>Raga</em> (Moment)
      - <em>Shiharikanot</em> (Of the dawns) | <em>Hupia'a</em> (Appeared) | <em>Mishehu</em> (Something) | <em>Ba</em> (In) | <em>Lekiyum</em> (To exist) | <em>Tod'a</em> (Consciousness).

      ***

      ## **PART TWELVE: DICTATION GUIDE**

      <strong>Consonant Pronunciations</strong>:

      - <strong>Aleph</strong>: Glottal stop (catch in "uh-oh").
      - <strong>Beth</strong>: B (boy).
      - <strong>Gimel</strong>: Hard G (go).
      - <strong>Daleth</strong>: D (dog).
      - <strong>He</strong>: H (hat).
      - <strong>Waw</strong>: W (water) or OO (moon).
      - <strong>Zayin</strong>: Z (zebra).
      - <strong>Heth</strong>: Guttural H (throat clearing).
      - <strong>Teth</strong>: Emphatic T (tongue retracted).
      - <strong>Yodh</strong>: Y (yes) or EE (see).
      - <strong>Kaph</strong>: K (kite).
      - <strong>Lamedh</strong>: L (light).
      - <strong>Mem</strong>: M (mother).
      - <strong>Nun</strong>: N (no).
      - <strong>Samekh</strong>: S (sun).
      - <strong>Ayin</strong>: Guttural A (from the throat).
      - <strong>Pe</strong>: P (pen).
      - <strong>Sade</strong>: Emphatic S (tongue retracted).
      - <strong>Qoph</strong>: Deep K (back of throat).
      - <strong>Resh</strong>: Rolled R.
      - <strong>Shin</strong>: SH (ship).
      - <strong>Taw</strong>: T (top).
      - <strong>A'an</strong>: Glottal stop or vowel.
      - <strong>H'</strong>: Guttural H.

      <strong>Vowel Insertion Rules</strong>: Vowels are inserted based on grammatical patterns. Matres lectionis (Aleph, He, Waw, Yodh) guide pronunciation.

      - <strong>A</strong> as in <em>father</em>.
      - <strong>E</strong> as in <em>bed</em> (e.g., <em>Helel</em> = Heh-lel).
      - <strong>I</strong> as in <em>machine</em>.
      - <strong>O</strong> as in <em>bone</em>.
      - <strong>U</strong> as in <em>moon</em>.

      ***

