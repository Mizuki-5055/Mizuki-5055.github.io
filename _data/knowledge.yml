      ### 2.5 The Nine Loves (in Japanese transliteration)

      | Arelik (as taught) | English |

      |---|---|

      | Dai-ai (大愛) | Romantic love |

      | Tsuki-ai (月愛) | Deep platonic love (moon love) |

      | Kazoku-ai (家族愛) | Familial love |

      | Yasashi-ai (優しい愛) | Innocent love |

      | Ei-ai (永愛) | Grief/persevering love (most powerful) |

      | Naimen-ai (内面愛) | Inner love / love of oneself |

      | Kami-ai (神愛) | Divine love |

      | Ai no ai (愛の愛) | Destructive love / obsession |

      | Ero-ai (エロ愛) | Sexual love |

      \*\*Source:\*\* The nine loves as taught in the Helelist tradition. 📖

