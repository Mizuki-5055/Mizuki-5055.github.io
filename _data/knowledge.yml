      ## Part Three: Arelik Grammar

      ### 3.1 Word Formation

      Arelik words are built from Semitic roots, typically consisting of three consonants (triconsonantal roots). Vowels are inserted between or around the consonants to form different words with related meanings.

      \*\*Root pattern example:\*\*

      | Pattern | Meaning | Example |

      |---|---|---|

      | MLK (root) | "king, ruler" | Malku (king), Malku'eli (bestowed by God) |

      | HLL (root) | "divine, radiant" (in tradition) | Helel (God of Gods) |

      \*\*Source:\*\* Word formation patterns from Arelik linguistics. 📖

      ---

      ### 3.2 Prefixes and Suffixes

      | Element | Function | Example |

      |---|---|---|

      | Ha- | Definite article ("the") | Ha'akium ("the Existence") |

      | -i | Possessive ("my") | Malku'eli ("my God is king") |

      | Mal- | Appointed by, from malku | Malhelel ("appointed by Helel") |

      | -el | God | Helel (Ha-El-El: "the God of Gods") |

      | -a | Feminine suffix (in some forms) | (varies by context) |

      \*\*Source:\*\* Grammatical patterns from Arelik. 📖

      ---

      ### 3.3 Compound Words

      Arelik frequently forms compound words by combining two or more roots:

      | Compound | Components | Meaning |

      |---|---|---|

      | Tarersetu | Tar + Ersetu | "the place of return to the source" |

      | Malhelel | Mal + Helel | "appointed by Helel" |

      | Ha'akium | Ha + akium | "the Existence" |

      | Kursyā d-Sahrā | Kursyā + d- + Sahrā | "Throne of the Moon" |

      \*\*Source:\*\* Compound word formation from Arelik. 📖

      ---

      ### 3.4 Reading Direction

      - \*\*Normal text:\*\* Left to right

      - \*\*Sacred inscriptions:\*\* May be arranged for "moon view" (to be read from above)

      \*\*Source:\*\* Arelik writing conventions. 📖

      ---

      ## Part Four: The Epoch of Existence Opening

      ### 4.1 Title and First Lines

      \*\*Title:\*\* Idayn Ha'akium

      \*\*Translation:\*\* The Epoch of Existence

      \*\*First lines:\*\*

      | Arelik | Phonetic | English Translation |

      |---|---|---|

      | Kadom Lahekium, layt hawa madem. | | Before Existence, there was not anything. |

      | Rik shel hoshets rik, netol klom. | | A void of hollow/empty darkness. Devoid of anything. |

      | Hidin kama'at ke'autu raga shiharikanot hupia'a, mishehu ba lekiyum: tod'a. | | Behold, at the same moment the void dawned, something came into existence: consciousness. |

      \*\*Source:\*\* The Epoch of Existence as preserved in Arelik sacred texts. 📖

      ---

      ### 4.2 Key Vocabulary from the Opening

      | Word | Meaning |

      |---|---|

      | Kadom | Before, in the beginning |

      | Lahekium | To/for Existence |

      | Layt | There is not |

      | Hawa | He/it was, became |

      | Madem | Anything, something |

      | Rik | Void, empty |

      | Shel | Of |

      | Hoshets | Darkness, chaos |

      | Netol | Taking, removing |

      | Klom | Everything |

      | Hidin | Behold |

      | Kama'at | As if, like |

      | Ke'autu | At the time |

      | Raga | Moment |

      | Shiharikanot | Of the dawns |

      | Hupia'a | Appeared |

      | Mishehu | Something, someone |

      | Ba | In, by means of |

      | Lekiyum | To exist, for existence |

      | Tod'a | Consciousness, knowledge |

      \*\*Source:\*\* Vocabulary from the Epoch of Existence. 📖

