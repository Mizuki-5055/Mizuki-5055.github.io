  - title: The Anihilation of Yariḫ Hekarta
    author: Mizuki Hokusei, Helelstic Records, Historical Accounts.
    description: |-
      ## The Founding of Yarikh Hekarta

      Before the land had a name, our ancestors wandered. The world was cold and dry. The springs did not flow. The earth gave nothing. They braved the dry seasons and the cold winds, moving from place to place, searching for water, for pasture, for a place to stop.

      One day, a small child among them—whose name is not preserved, or is not mine to speak—beseeched the moon. The child called out to Malhelel, son of Helel. And the moon's glow cast its light upon the land. From that moonlight, water sprang. A spring rose from the ground at 'Ain es-Sultan, and it did not stop flowing.

      That spring gave the people life. They settled beside it. The cold did not break them. Over generations, the land grew warm enough to thrive. They built homes, then walls, then temples. They carved the moon into their tools, their architecture, their scripture. They called the place \*\*Yarikh Hekarta\*\*—the City of Yarikh. And they called themselves by their tongue, \*\*Arelik\*\*, and they worshipped Malhelel, whom other tongues would later call Sin, or Yarikh, or Nanna.

      The city grew. It became a center of the moon. Pilgrims came. The spring kept flowing. The walls kept rising.

      ## The Coming of Malh'edu

      In the time of the city's strength, a high priestess came to Yarikh Hekarta. Her name was \*\*Zainab Sargon kin\*\*, or \*\*Zainab Akkad kin\*\*—daughter of Sargon of Akkad. She was devoted to the moon god, whom her people called Sin and ours called Malhelel. She came bringing scriptures, tales, and tablets of his stories. She exchanged them with our priests and scribes. She taught us that Malhelel went by many names in many tongues—Sin, Yarikh, Malhelel—but was one god, the moon, the illuminator.

      She said her destiny lay in Ur. She said that under her father's rule, we would be able to worship without fear of conquest or persecution. And she kept her word.

      She left Yarikh Hekarta for Ur. But she did not forget us. She sent messengers back along the road, carrying letters and gifts. She believed she belonged in Yarikh Hekarta, closer to Malhelel. But her father forbade her to leave Ur, for political reasons. She was confined. She learned many tongues and scribed in many languages, but she longed to speak Arelik freely. In our tongue, she was \*\*Malh'edu\*\*—Malhelel's jewel.

      She lamented her work in Ur. Her lament is remembered. And when she fell—when she was cast out, or imprisoned, or silenced, the tales differ—the fate of Yarikh Hekarta was sealed with hers.

      ## The Fall

      After Malh'edu's fall, a messenger was caught on the road to Yarikh Hekarta. He was coming to pilgrimage her tomb. The men of Akkad—descendants of Sargon, or his soldiers, or those who claimed his authority—searched for her tomb in our city. They did not find her, for she was not in our presence.

      They pillaged our land. They destroyed our temples, our homes, our statues. They set the city ablaze. The fire did not last long, for they sought not to burn but to pillage, massacre, and destroy.

      Our ancestors fought back. The battle lasted nine days. After nine days, the men of Akkad simply left, seemingly having their fill of massacring us.

      They killed our men, our women, our children. They took our wives, our sisters, our mothers, our daughters—used them and sold them. They killed our brothers, our sons, our fathers who fought back. They sold the children who could not escape.

      Those lucky enough to flee or hide had to witness the fall of our city's walls. The spring was tainted with blood and ash. Our buildings, temples, and statues crumbled. Our protection was destroyed.

      ## After

      The city was not erased. It was rebuilt, as it had been before, and as it would be again. But the memory of that destruction was carried in our people's tongue, in our lamentations, in our scripture. We will remember the spring tainted with blood, and the walls falling, and the moon still rising above the ruins.

      The conquerors came again. They always came again. Akkad, Babylon, Rome, the empires of the book. Each one destroyed, rebuilt, conquered, liberated, conquered again. And now the city is occupied once more, and the spring still flows, and the moon still rises, and our people still remember.
