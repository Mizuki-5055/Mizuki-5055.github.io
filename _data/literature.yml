heading: Extra Lore
intro: A collection of additional lore, details, and information on the THOFS Universe.
items:
  - title: Global Currency Standard in Helvar.
    author: ONLY TWO FORMS OF CURRENCY OFFICIALLY USED AND RECOGNIZED
    description: |-
      ### **A. The Lux (The Gold Standard)**

      The **Lux** is the premier global currency, originating from the Age of the Gods when gold coins were used primarily as standardized measuring weights.

      - **Origin & Scarcity:** During the life of the god Abraxa, gold was common due to Eldric earthbending. Following the Deicide and the siphoning of earthbending, gold became the rarest mineral on Helvar.


      - **The Eldric Monopoly:** The Eldric Royal Family, descendants of the first Eldric couple, controls the only mint capable of forging Lux.


      - **Magical Forging:** Lux coins are not minted traditionally but are forged through a specific spell known only to the Eldric royal lineage.


      - **Verification & Appearance:** \* **The Touch-Glow:** All living beings, regardless of race, can verify a Lux coin through touch. When untouched, the coins are dull, slick, and smooth. Upon contact with a living being, a legitimate coin emits a soft golden glow and reveals the Eldric Royal Crest.


      - **Glow Duration:** The magical glow persists for exactly five seconds after the bearer's touch is removed.


      - **Projection Mechanic:** When placed in a pile, the coins project a light-projection of their total sum/weight above them, a feature originally intended for trade efficiency.


      - **Denominations:**
      - **500 Lux** (Largest)


      - **250 Lux**


      - **100 Lux**


      - **50 Lux**


      - **10 Lux** (Smallest)



      ### **B. The Helios (The Bone Standard)**

      The **Helios** is the secondary, more common currency used primarily by the poor, common folk, and discriminated races.

      - **Composition:** Helios coins are carved from the rare bones of **Leviathans** found along shorelines or retrieved via diving.


      - **Appearance:** The bone leaves a dark purple scratch where it is etched.


      - **Production:** The coins were originally established by the Krunei-run Trade Commission and must be etched by the "metal hands" of an **Ignis-Krei** or the "delicately skilled hands" of a **Fae craftsman**.


      - **The Fae Monopoly:** During a trade embargo, a wealthy Fae craftsman family used their Lux reserves to assert a monopoly over the Helios, paying twice the value for Leviathan bones to prevent the currency's value from being undermined.


      - **Denominations & Exchange Rate:**
      - **1, 10, 25, 50, 100 Helios**


      - **500 Helios:** Equivalent to **10 Lux**


      - **1000 Helios:** Equivalent to **20 Lux**
