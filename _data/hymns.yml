heading: Hymns
intro: A collection of sacred hymns from the Lateo speaking Helelstic Diaspora
items:
  - title: Reverentia Ad Lunae [1673]
    author: Berratus Nunil
    description: |-
      Reverentia ad Lunae, 

      venti tacitas tempestates ferunt,

       Suspice ad lunam, nam ipse omnem animam protegit. 

      lux eus lunae eius nos custodit. 
      Malhelel, custos noster lunaris. 

       O ens lunari divinum, 

      personificatio omnis existentiae, 
      quomodo te Helel ex sua existentia genuit, 

      reverentia ad Lunae.
       Luna quae numquam avertit eius oculos,

       luna pro qua manere elegit, eum veneramur.

       Verba eius procellas regunt,
       reverentia ad lunae, 

      sanguis eius cum potentia fluit,

       reverentia ad lunae,

       motus eius ventos imperante,
       reverentia ad lunae, 

       O CARISSIME DEUS LUNAE, 
      proles HELEL,
       humanitis custos lunari patronum,

       MUNDUS TE VENERAT.
       UT LAUDEM HELEL

      DEO NOSTRO

      reverentia
      ad lunae
