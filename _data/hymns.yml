heading: Hymns
intro: A collection of sacred hymns from the Lateo speaking Helelstic Diaspora
items:
  - title: Reverentia Ad Lunae [Brutus Castello Nunil | 1673]
    author: Brutus Castello Nunil
    description: |-
      Reverentia ad Lunae! 

      Venti tacitas tempestates ferunt, 
      suspice ad lunae
       nam ipse omnem animam protegit.

       Lux eius lunæ eius nos custodit,
       Malhelel, custos noster lunaris!

       O' ens lunari, divinum,
       personificatio omnis existentiæ, 
      quomodo de Helel
       ex sua existentia genuit

       Reverentia ad Lunae!

      Lunae quid numquam avertit eius oculos,
      Lunae pro qua manere elegit 
      eum veneramur,

      Lunus nostrum venerat,
       verba eius procellas regunt.

       Reverentia ad lunæ! 

      Sanguis eius cum potentia fluit.

       Reverentia ad lunæ!
       Motus eius ventos imperante.
       Reverentia ad lunæ! 
      Eius cuius iridescentia per omnia radiat.

       Reverentia ad lunæ! 

      Lunus nostrum, lunus nostrum, 
      Lunus nostrum, Malhelel 

      eius de calamitas infin**é**.
      Reverentia ad lunæ, Malhelel
      eius de affectus infin**é**

      Reverentia! revere
      Reverentia! revere

       Ad nostrum Lunus, Malhelel

      Ventos! Aquæ, tempestat, omnes voluntate eius reguntur,
      Khoas/Caos, potestas, ordo, quoque omnes voluntari eius regentur, 
      Vita, mors ipsa existentia, omnia, reverere MALHELEL!

      O' CARISSIM**é** deus lunæ, proles Helel
       humanitis custos lunari patronum, 
      mundos te venerat, ut laudem Helel
      DEO NOSTROM!

       Reverentia! Reverentia!
