heading: Scripture
intro: Texts and Scripture on Helelism
items:
  - title: The 15 Core Tenets of Helelism
    reference: Universal Introduction to Helelism By Mizuki Hokusei
    description: |-
      # THE CORE TENETS OF HELELISM

      **1. The Ha Atem is Absolute Truth.** There exists one singular, immutable, eternal reality—the Ha Atem—which is the foundation of all existence. Truth is fixed and unchanging, regardless of perception.

      **2. Helel is the Supreme Divine.** Helel is the ultimate embodiment of Absolute Truth and Unconditional Free Will, the original source of all existence, whose authority is inherent, not coercive.

      **3. Free Will is Absolute and Unconditional.** Every conscious being possesses unlimited capacity for independent choice and self-governance. Violating another's free will is the ultimate falsehood.

      **4. Omission is Lying.** Withholding any part of the complete truth intentionally creates a false narrative and is therefore a form of deception.

      **5. Truth Must Be Chosen, Not Dictated.** Genuine understanding of truth arises from personal exploration and discernment, never from external imposition or force.

      **6. Truth is Multifaceted, Yet Unalterable.** Absolute truth can be perceived in countless ways, but those perceptions do not change the underlying reality itself.

      **7. Magic is Intrinsic Power.** Magic is an inherent emanation from Helel's essence, accessible to all conscious beings as an innate capacity to create and influence reality.

      **8. Truth Withstands All Scrutiny.** Truth is unshakeable and welcomes examination; it is strengthened by questioning, not threatened by it.

      **9. There is Only Truth and Perspectives.** Existence consists solely of Absolute Truth and the various ways beings perceive it—not "right vs. wrong" or "good vs. evil."

      **10. We Never Dictate Nor Control Beings.** Helelists are forbidden from using any influence to coerce, manipulate, or control the will of any other conscious being.

      **11. Never Lie, Without Exception.** Absolute, unwavering honesty is required in all things. Lies corrupt the Ha Atem itself; a Helelist would rather die in truth than live in falsehood.

      **12. Death is a Universal Passage.** Death is not an end but a transition—a passage where souls encounter the Ha Atem's truth and continue their eternal journey.

      **13. Respect All Chosen Paths.** Every being's chosen beliefs and path must be respected, not merely tolerated, as each offers a unique perspective on truth.

      **14. The Soul is Immortal Consciousness.** The soul is the eternal, conscious, sentient will of a being—the core identity that persists beyond physical form.

      **15. There Are No Binary Constructs.** All moralistic binaries (good/evil, light/dark, appropriate/inappropriate) are false constructs that distort the unified reality of pure existence and truth.
