heading: Characters
intro: A collection of information on all Helvarian characters.
items:
  - title: Melody Dahle
    reference: Elfae
    description: |-
       AGE: 20 years old at the start of the book.

      · SEX: Female.

      · RACE: Elfae (Half Fae, Half Eldric hybrid)

      · APPEARANCE: She is a tall and beautiful young woman. Her hair is a Golden blonde hue. Her skin is bone white, with rosy cheeks. She has blue eyes and has a rosy nose. Her hair is long with a middle part. She wears a black ribbon in a bow on her hair. Her attire consists of a silvery blue top, with a darker blue hooded cape with black embroidery. She wears a black skirt with silver embroidery and long black boots. She always carries a small dagger on her along with a small notepad.

      · POWER LVL: Tier 4 magic at the start of book thanks to her “father” the merchant, later able to reach tier 6. Given she is an Elfae she had the ability to float however, severing her wings removed this ability. She is not aware she can transform into nature and elemental like forms yet.

      · ORIGIN: Born on Dyre Island, the slums of Helion during the Lunmara festival. She quickly learned that her singing (fueled by joy and hope) could heal and ease people. Her parents, poor and of a discriminated race, exploited her for gold. Later sold by her poor parents to a merchant at age 10.

      · UPBRINGING: Håkon Dahle, the merchant, groomed her to hate her heritage, mutilated her wings/ears at 11, trained as bodyguard/lab rat. She is unaware of his true motives and believes he is her caring and loving father.
  - title: Estelle Gartland
    reference: Eldric
    description: |-
      
      · AGE: 20 years old at the start of the book.

      · SEX: Female

      · RACE: Eldric

      · APPEARANCE: She is a rather tall young woman. Brown silky hair, long and full but she braids it. She has the signature Eldric white feathered wings at the nape of her neck, these are small and elegant, about the size of an owl's feathers. She has fair skin and green eyes. She wears a simple white long sleeve top. An emerald satin long skirt and a matching emerald satin hooded cape to match. The clothes are embroidered with intricate nature-like designs. She wears a handmade necklace made of twine with a beautiful, polished amber as a pendant.

      · POWER LVL: Inherently a tier 3 in the beginning of the story will later reach tier 6. Can float like all Eldric, is not yet aware she can camouflage by turning invisible for a short period of time.

      · ORIGIN: Born on the continent of Isdrivore, Sole survivor of Gartland village destroyed by the impact of a fallen light during Lunmara festival.

      · UPBRINGING: Raised by Disciples, deemed "cursed" due to village destruction.
  - title: Håkon Dahle
    reference: Human
    description: |-
       AGE: 35 years old when Melody is 20, (36 when she is 21)

      · SEX: Male

      · RACE: Human

      · APPEARANCE: He is a tall and well poised man, he has a short trimmed black beard. He is white skin tones with brown eyes. His hair is well groomed and black. He has a small scar on his lip. He wears a monocle. His attire is a fancy 4 piece Victorian suit. It is purple and black and very well intricate. He is well built. And always carries a ledger with him.

      · POWER LVL: No magic as of yet, he will later dabble in stolen magic.

      · ORIGIN: Born in a human village in the continent of Aurora, Now lives in Helion.
  - title: Theron Barclay
    reference: Human
    description: |-
      
      · AGE: 42 at story starts then 43 when Estelle leaves the orphanage.

      · SEX: male

      · RACE: human

      · APPEARANCE: He is a tall gaunt man in his forties. He always wears a white silvery robe over a black priestly suit, with dual sun and moon motifs. He has dark grey hair and wears a small cap on his head. His eyes are a silvery blue.

      · POWER LVL: No magic.

      · ORIGIN: Born in western Helion, before the Krunei border was established. now disputed Krunei territory run by the rebel Krunei faction.
  - title: Axel [Hagen] Gartland
    reference: Human
    description: |-
      · AGE: 14 at the start of the story, 6 years younger than Estelle.

      · SEX: Male.

      · RACE: Human.

      · APPEARANCE: He is a cheeky little white boy with disheveled black hair and fair skin. He has hazel colored eyes and freckles across his nose and cheeks. His body is riddled with small little cuts and bandages due to his rowdy nature. He wears short black shorts and a white tank top with a navy blue unbuttoned dress shirt over it. He is always a bit dirty looking from playing outside. He is carrying a white feather.

      · POWER LVL: None, until he realised the feather Estelle gave him could be used to access tier five magic.

      · ORIGIN: Axel was born to human parents (Amanda and Björn Hagen) in the capital city Eldrefjell of Isdrivore. His parents were murdered for their proactive views on other races when he was just two years old, the disciples taking him in shortly after due to knowing his late parents. He is now cared for in the orphanage where he grew a strong unbreakable bind with Estelle Gartland, with him unofficially taking her surname as well.
  - title: Ryokrei Masaki
    reference: Krunei, Ryokrei Race
    description: |-
      · AGE: 40 when the gem falls.

      · SEX: male

      · RACE: Krunei, From the Arkinet clan of Ryo-Krei.

      · APPEARANCE: He is a tall muscular man. With stag antlers, his hair is black and in a high ponytail, he looks Japanese and his eyes are a vibrant red hue. He wears a long and thick red cape that touches the floor to hide his maroon feathered wings. He is a tanned skin colour. He wears a black suit with golden embroidery. And gold rings.

      · POWER LVL: Tier 6.

      · ORIGIN: Born to a prominent Arkinet Leader of the Pentagram of Prosperity. He was born in the Ryo-Krei capital of Matsuri, in Arkinet. He fled Arkinet at the disapproval of both his mother and the Pentagram of Prosperity. He is now the unofficial diplomat and honorary council member for Helion.
