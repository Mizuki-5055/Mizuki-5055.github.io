heading: Characters
intro: A collection of information on all Helvarian characters.
items:
  - title: Melody Dahle
    reference: Elfae
    description: |-
       AGE: 20 years old at the start of the book.

      · SEX: Female.

      · RACE: Elfae (Half Fae, Half Eldric hybrid)

      · APPEARANCE: She is a tall and beautiful young woman. Her hair is a Golden blonde hue. Her skin is bone white, with rosy cheeks. She has blue eyes and has a rosy nose. Her hair is long with a middle part. She wears a black ribbon in a bow on her hair. Her attire consists of a silvery blue top, with a darker blue hooded cape with black embroidery. She wears a black skirt with silver embroidery and long black boots. She always carries a small dagger on her along with a small notepad.

      · POWER LVL: Tier 4 magic at the start of book thanks to her “father” the merchant, later able to reach tier 6. Given she is an Elfae she had the ability to float however, severing her wings removed this ability. She is not aware she can transform into nature and elemental like forms yet.

      · ORIGIN: Born on Dyre Island, the slums of Helion during the Lunmara festival. She quickly learned that her singing (fueled by joy and hope) could heal and ease people. Her parents, poor and of a discriminated race, exploited her for gold. Later sold by her poor parents to a merchant at age 10.

      · UPBRINGING: Håkon Dahle, the merchant, groomed her to hate her heritage, mutilated her wings/ears at 11, trained as bodyguard/lab rat. She is unaware of his true motives and believes he is her caring and loving father.
