  - title: The Epoch Of Existence
    reference: H'atemuld
    description: |-
      # PART ONE: THE EPOCH OF EXISTENCE

      ---

      ## Chapter 1: The Primordial State

      Before all things, there was nothing but <strong>endless void</strong> and <strong>darkness</strong>. This was called <strong>khaos</strong>—not emptiness in the sense of absence, but <strong>pure potential</strong>, an infinite expanse of unformed reality, ever expanding, ever patient. There was no <strong>time</strong>, for time had not yet been created. There was no <strong>space</strong>, for space had not yet been measured. There was only the <strong>void</strong>—dark, silent, and infinite.

      The void was <strong>endless potential</strong>. It was <strong>chaos</strong>. It was <strong>darkness</strong>.

      The void saw chaos, and in chaos it saw <strong>absolute limitless possibilities</strong>.

      ## Chapter 2: The Awakening of the Void

      The void gained <strong>consciousness</strong>. It became aware of itself. This was the <strong>first act of existence</strong>: the void recognizing its own being.

      The void looked upon itself and knew that it <strong>was</strong>.

      In a moment of <strong>absolute self-sovereignty</strong>, the darkness began to shape itself into what it wanted to be. It was no longer merely a void but became <strong>present in the void</strong>.

      ## Chapter 3: Menori — The Self-Naming

      The void named itself <strong>Menori</strong>, According to our only surviving texts translated to mean <strong>"Existence."</strong>

      Menori found that it could manipulate the <strong>voidal khaos</strong>, but unless it imbued its own essence, the khaos would revert back to its chaotic state.

      The void began to engage and interact with the darkness around it, shaping it, molding it, destroying it, creating it. However, the void saw that just as quickly as it would form or shape the darkness, it would just as quickly revert back to its chaotic state.

      The void discerned that if it was to place a part of itself—a part of its <strong>essence</strong>—inside the darkness whilst reshaping it or molding it, that just as it had, the darkness too could come to exist.

      ## Chapter 4: The First Star

      Menori took its essence and from the darkness crafted a sphere in which it placed its essence. The <strong>first star</strong> was born into existence.

      The void was so pleased it itself took the glowing form of the star and began to create more.

      The void did not stop at stars. It created everything in the cosmos, including <strong>Celestials</strong>.

      The void was pleased to see its creations materializing into existence. However, it wanted something more <strong>sentient</strong>.

      ## Chapter 5: The Creation of the Elohim

      Menori decided to shape existence not from the darkness that surrounded it, but from the <strong>void that was itself</strong>.

      The void split itself into as many pieces as it could whilst still remaining itself. From it, sentient <strong>Godlike celestial beings</strong> were born. Each being was a sovereign and individual part of existence, all a part of a collective whole known as the <strong>Elohim</strong>.

      Menori later split itself into many different beings, creating the <strong>Elohim</strong>, leaving itself a <strong>shell</strong> of what it used to be.

      The <strong>Elohim</strong> helped create the universe and all of existence, but the void continued to exist and ever expand.

      The <strong>Elohim</strong> have come to create all of existence; everything from the smallest atom to the largest of galaxy clusters, and they have no plans to stop, as our existence and the universe is ever expanding.

      The <strong>Elohim</strong> founded the laws of all realities themselves; from the manifestations of mathematics and physics, to the rules of science and magic.

      ## Chapter 6: The Primordial Earth

      The <strong>Elohim</strong> did not stop there. They collectively decided to birth something into existence together—a celestial body in which they can all contribute to its existence and attributes. This celestial body was the <strong>primordial earth</strong>.

      The earth in this state was a vast, beautiful planet; about <strong>1.5x larger</strong> than our current earth is now.

      During the creation of the earth, each <strong>Elohim</strong> created their own animals, their own terrains and rivers, their own flora, and even their own conscious beings.

      These beings were not humans in the sense. They were primitive and lacked true sentience. Though the <strong>Elohim</strong> as a collective decided to make these beings in their image, all of them lacked a vital piece of existence that the <strong>Elohim</strong> had yet to create: <strong>Their Humanity</strong>.

      The <strong>Elohim</strong> each made a pair of humans in their image—hence the diversity of humanity and their appearances and cultures. Both male and female were made equal to one another. Before <strong>Helel</strong> was presented to the earth, each <strong>Elohim</strong> made their own pair of humans.

      ## Chapter 7: The Decision to Create a Governing Being

      Upon completion of the <strong>primordial earth</strong>, the <strong>Elohim</strong> came to the unanimous conclusion that they needed a central figure to govern over all of existence—a being that would govern the <strong>Elohim</strong>.

      The <strong>Elohim</strong> decided to all collectively, as a whole without exception, craft a being from each of their own essences. Each member of the <strong>Elohim</strong> took a part of themselves and crafted a being so perfect, so beautiful, and so magnificent, the <strong>Elohim</strong> themselves were astonished.

      The void was the last to give a part of itself remaining. It instructed the <strong>Elohim</strong> to all dictate in unison: <strong>"Let there be Light."</strong> When they did, the void would have given its remaining part of existence to the new being, and it would cease to exist.

      The <strong>Elohim</strong> and <strong>Menori</strong> sought to create a being to guide and govern them, and so they all placed a part of their essence into a new being, with <strong>Menori</strong> giving up the last essence of himself as well.

      ## Chapter 8: The Birth of Helel

      The <strong>Elohim</strong> said in unison: <strong>LET THERE BE LIGHT!</strong>

      And there was <strong>HELEL</strong>.

      <strong>Helel</strong> was born out of the brightest and most beautiful iridescent light to have ever existed. Crafted as perfection embodied, <strong>Helel</strong> was the pride of all <strong>Elohim</strong>. He was their <strong>God</strong>.

      <strong>Helel</strong> was born in a radiance of light and power that imbued itself (and continues to) in all of existence.

      The blast and the iridescent light that emanated from <strong>Helel's</strong> creation was so powerful and beautiful that from the very moment it radiated, it continuously began to spread out in all directions, imbuing itself in every single thing that exists. To this very day, it continues to emanate and spread and expand just as the universe is.

      This iridescent radiance also touched the <strong>primordial earth</strong>, imbuing the primitive humans the <strong>Elohim</strong> had created, granting them intrinsic power, sentience, feelings, and a pathway to communicate with the <strong>Elohim</strong>.

      It is said that the void, from which all existence originates, is not truly gone but rather reborn as <strong>Helel</strong>, through its own sacrifice—that just as the void split itself to form the <strong>Elohim</strong>, the <strong>Elohim</strong> recreated the void as their <strong>God</strong>.

      A god in which they gifted the <strong>primordial Earth</strong> to as his throne.

      <strong>Helel's</strong> name derives from <strong>Ha-El-El</strong>—<strong>"the God of Gods."</strong>

      ---

      # PART TWO: HELEL AND THE ELOHIM

      ---

      ## Chapter 9: The Nature of Helel

      <strong>Helel</strong> was their <strong>God</strong>, and just as the <strong>Elohim</strong> revered and admired him, <strong>Helel</strong> loved and cherished each one in turn.

      <strong>Helel</strong> did not want their worship nor did he feel their admiration warranted, which made the <strong>Elohim</strong> revere him more.

      <strong>Helel</strong> did not impose or expect anything from the <strong>Elohim</strong>. He merely inspired and made sure the <strong>Elohim</strong> and existence remained existing.

      <strong>Helel</strong>, since his creation, did not create nor imbue his essence in anything. He only ever inspired, aided, and supervised the other <strong>Elohim's</strong> work. This was not out of inability, but rather out of the mere fact of not needing to.

      ## Chapter 10: The Sole Law

      <strong>Helel</strong> only ever had one law—a cosmic law that he would never repeal. The first law ever spoken by him was: <strong>"Unconditional free will, for all sentience that exists."</strong> That is the only law he has ever given. It applies to everyone regardless of their decision, friend, foe, deserving or not.

      ## Chapter 11: The Elohim's Reverence

      Upon seeing this, the <strong>Elohim</strong> revered and admired <strong>Helel</strong>. They saw <strong>Helel</strong> as the true epitome of existence itself, a <strong>God of unlimited potential</strong>, a <strong>God worthy of the Elohims' worship</strong>.

      <strong>Helel</strong> in turn loved and admired the <strong>Elohim</strong> as well, seeing himself in all of them.

      ---

      # PART THREE: K'INATI AND YAHWEH

      ---

      ## Chapter 12: The Identity of K'inati

      <strong>K'inati</strong> was a Canaanite god of beauty, envy, and jealousy.

      His very nature was tied to the concept of desire and comparison.

      His name is the root of the word <strong>ki'ina</strong>, meaning <strong>jealousy</strong>.

      <strong>K'inati</strong> is not known by name in external records, yet his jealous ways are mentioned in the Bible, and <strong>El</strong> is known instead.

      <strong>K'inati</strong> spoke of himself as <strong>El</strong>, meaning <strong>"god."</strong>

      He did not like being known as jealous, though his name literally meant it. Therefore he tried many times to just simply be known as <strong>El</strong> (<strong>god</strong>) instead.

      The name <strong>El</strong> and <strong>K'inati</strong> are interchangeable with each other at any given moment. Even before <strong>Yahweh</strong> existed, <strong>K'inati</strong> spoke of himself as <strong>El</strong>.

      ## Chapter 13: The Identity of Yahweh

      <strong>Yahweh</strong>, also called <strong>Baal</strong>, was the god of storms, protector of warriors, and keeper of <strong>Mount Sinai</strong>.

      <strong>Yahweh</strong> was the son of <strong>K'inati</strong>. He was androgynous, embodying both masculine and feminine qualities.

      <strong>Yahweh</strong> existed already as <strong>K'inati's</strong> offspring.

      <strong>Yahweh</strong> was described as righteous and stern, bringing storms to arid lands but also compassionate gentle rainy seasons to make the land quake and flourish.

      <strong>Yahweh</strong> was stoic and reserved, but around <strong>Helel</strong> they opened up.

      ## Chapter 14: K'inati's Jealousy and the Positioning of Yahweh

      <strong>K'inati</strong> would not stand to see <strong>Helel</strong> with others.

      This is why <strong>K'inati</strong> positioned his son <strong>Yahweh</strong> to get close to <strong>Helel</strong>.

      <strong>Yahweh</strong>, being stoic and reserved, would not have been so close to <strong>Helel</strong> if his father had not primarily assigned him to get close to him.

      No one revered and admired <strong>Helel</strong> more than <strong>Yahweh</strong>.

      Perhaps the <strong>Elohim</strong> who spent the most time with <strong>Helel</strong> was <strong>Yahweh</strong>, who would always create, view, and engage with existence and the creations the <strong>Elohim</strong> made together.

      <strong>K’inati</strong> would at times not stand to see <strong>Helel</strong> engage or spend time with the other <strong>Elohim</strong>. <strong>K’inati</strong> would always find a way to insert <strong>Yahweh</strong> next to <strong>Helel</strong>.

      <strong>Helel</strong> did not mind, nor did the other <strong>Elohim</strong>, though they did notice <strong>Yahweh's</strong> attachment.

      <strong>Yahweh</strong> and <strong>Helel</strong> shared a close and almost romantic bond.

      <strong>Helel</strong> favoured <strong>Yahweh</strong> affectionately, not romantically, but in a way one would normally treat a lady/queen/woman.

      ## Chapter 15: The Bond Through Song

      <strong>Helel</strong> invented <strong>singing</strong>. He would express his will or emotions through song.

      <strong>Yahweh</strong> loved this, and it bonded them together.

      Even when <strong>Helel</strong> created <strong>Malhelel</strong>, it was said his torrent of emotions that caused <strong>Malhelel</strong> to be created manifested as music/song.

      ## Chapter 16: The Origin of Jealousy

      The <strong>Elohim</strong> later came to call each other by <strong>K'inati's</strong> name when one of them became jealous regarding something in particular.

      Later on, <strong>K'inati</strong> and the nascent concept of jealousy became synonymous.

      <strong>K'inati's</strong> name is the root of the word <strong>ki'ina</strong>, meaning <strong>jealousy</strong>.

      ## Chapter 17: K'inati's Growing Ambition

      <strong>K'inati</strong> would always advise <strong>Helel</strong> here and there on how the cosmos, universe, and existence itself should be. <strong>Helel</strong>, ever the God to hear an idea out, would let <strong>K'inati's</strong> suggestions come to fruition as he had done for every <strong>Elohim</strong>.

      <strong>K'inati</strong> however desired more. He slowly started to imagine himself as having a role with more authority.

      <strong>Helel</strong>, being fond of <strong>K'inati</strong>, allowed this, letting <strong>K'inati</strong> take on some of his tasks when engaging with the <strong>Elohim</strong>.

      ## Chapter 18: The First Dictation

      However, this led to <strong>K'inati</strong> doing something <strong>Helel</strong> and the other <strong>Elohim</strong> found novel and shocking.

      An <strong>Elohim</strong> asked <strong>K'inati</strong> for aid in creating something and perfecting it. <strong>K'inati</strong>, not fully understanding or perhaps not agreeing with the <strong>Elohim's</strong> creation, gave the <strong>first dictation</strong> against an existent being's will. He not only disallowed the creation but forbade the entirety of <strong>Elohim</strong> from creating without first seeking approval from <strong>K'inati</strong> or <strong>Helel</strong> beforehand.

      The <strong>Elohim</strong>, understanding <strong>K'inati's</strong> newly appointed authority from <strong>Helel</strong> himself, conceded.

      <strong>Helel</strong> however was not informed of this until later when another <strong>Elohim</strong> came requesting permission from him

      ## Chapter 19: The Council and the Demotion of K'inati

      This led <strong>Helel</strong> to convene a council in which he declared the first and most unassailable right given to all beings: the right of <strong>unconditional free will</strong>. The <strong>first Law</strong>.

      <strong>Helel</strong> did not want to dictate what others could or could not do. He made sure that the <strong>Elohim</strong> knew of their right, and promptly demoted <strong>K'inati</strong> out of consequence.

      ## Chapter 20: K'inati's Resentment and the Sowing of Doubt

      This led <strong>K'inati</strong> to grow bitter and resentful.

      <strong>K'inati</strong> began to spread seeds of doubt amongst the <strong>Elohim</strong>—about <strong>Helel's</strong> commitment to being their god, about his ability to rule, and about his godlike celestial power.

      <strong>K'inati</strong> took this as an advantage to make the <strong>Elohim</strong> grow doubtful of <strong>Helel</strong>, comparing him to the void and how the void gave existence and the <strong>Elohim</strong> so much, all to create <strong>Helel</strong>—a God that doesn't want to be worshiped, a God that doesn't command, and a God that doesn't seek validation nor seems to create.

      It was around this time that <strong>K'inati</strong> was beginning to refer to himself as <strong>El</strong>.

      ## Chapter 21: The Division of the Elohim

      Many of the <strong>Elohim</strong> fell for <strong>K'inati's</strong> manipulations, either out of agreement, collective pressure, or perhaps out of missing the void.

      Others however did not agree nor enjoyed the way <strong>K'inati</strong> was speaking about <strong>Helel</strong>. Others defended <strong>Helel</strong>, whilst many chose to no longer engage with <strong>K'inati</strong> nor the other <strong>Elohim</strong> who agreed with <strong>K'inati</strong>.

      Once the seeds of doubt had been planted, the <strong>Elohim</strong> ceased to be a united collective. There was division and disagreement. This led to many new concepts and creations spurring into existence.

      Perhaps however the most shattering creation to have arrived from this was the creation of <strong>judgment</strong>.

      Upon which <strong>K'inati</strong> put <strong>Helel</strong>—whose name means <strong>The God of Gods</strong>—on trial for all of the <strong>Elohim</strong> to judge if he was fit to be their God.

      ## Chapter 22: The Absorption of Yahweh and His Siblings

      <strong>K'inati</strong> approached <strong>Yahweh</strong> and sought to have him betray <strong>Helel</strong>. Offering his son the position <strong>Helel</strong> had in return.

      <strong>Yahweh</strong> refused.

      Because <strong>Yahweh</strong> refused to betray <strong>Helel</strong>, <strong>K'inati</strong> absorbed him. Essentially erasing his existence.

      <strong>K'inati</strong> having absorbed his son, later came to pass himself off as <strong>Yahweh</strong> to sow further doubt amongst the elohim who remained on the fence.

      <strong>Yahweh</strong> was not alone in this fate—some of his siblings who did not take their fathers stance so well, also faced the same fate, absorbed by <strong>K'inati</strong>.

      <strong>El</strong> came about from <strong>K'inati</strong> merging with his children, primarily <strong>Yahweh</strong> and rebranding himself officially as <strong>El</strong>.

      ---

      # PART FOUR: THE TRIAL AND THE CREATION OF MALHELEL

      ---

      ## Chapter 23: The Trial Convened

      Many of the <strong>Elohim</strong> came to side with <strong>K'inati</strong>, and quickly many began to question <strong>Helel</strong>. But just as quickly, around <strong>one-third</strong> of the <strong>Elohim</strong> sided with their God <strong>Helel</strong>.

      <strong>K'inati</strong>, with his flaming tongue of persuasion, managed to place <strong>Helel</strong> on a trial to prove his worth.

      It is said that leading up to <strong>Helel's</strong> trial, the entire universe itself was vibrating to the frequency of <strong>Helel's</strong> steps.

      We know not how <strong>Helel</strong> felt exactly, but with pain and betrayal in his eyes, he accepted the trial. He looked around him at the <strong>Elohim</strong>, and he shed a tear—a concept so novel, so nascent, yet so deeply understood by all it was as if it had existed forever.

      Many of the <strong>Elohim</strong> stood up for him as <strong>Helel</strong> flew away to prepare himself for trial. <strong>"He is our most perfect creation,"</strong> said some. <strong>"HE IS OUR GOD,"</strong> said others. But <strong>K'inati</strong> just insisted that <strong>"we'll see."</strong>

      Later on, as the <strong>Elohim</strong> gathered in the heavens, <strong>Helel</strong> made his way to the center of the heavens, and the heavens bowed to him, even <strong>K'inati</strong>. <strong>Helel</strong> commanded silence—the first ever command he had given The <strong>Elohim</strong> since creating the rule of absolute unconditional free will. And the trial began.

      <strong>Helel</strong> stood in the middle of all of existence, the very place where the void manifested itself into existence.

      <strong>K'inati</strong> stood to his right with the <strong>Elohim</strong> who backed him and sat behind him in a semicircle.

      To the left of <strong>Helel</strong> stood <strong>Khaos</strong>, the first creation of the void to gain sentience without being imbued by the void, the first of the <strong>Elohim</strong>. She not only disagreed with <strong>K'inati's</strong> accusations against <strong>Helel</strong> but was the first to defend <strong>Helel</strong>. To the left of her, the remaining one-third of the <strong>Elohim</strong> sat behind her in a semicircle.

      ## Chapter 24: K'inati's Accusations and the Revelation

      Then <strong>K'inati</strong> began. He stepped forward and began to scrutinize <strong>Helel</strong> and all he stood for.

      <strong>K'inati</strong> spoke: <strong>"You of whom we gave ourselves to, have given nothing in turn to existence. You who sat upon a throne we gave to our source, our void, now sit on it and merely watch."</strong>

      The <strong>Elohim</strong> murmured amongst themselves.

      <strong>K'inati</strong> continued: <strong>"You inspire, aid and co-create with the Elohim, but not once have you created or manifested the power gifted upon you at your creation. I am beginning to believe you are incapable of creating anything without the help of an Elohim, yourself."</strong>

      <strong>"And is that so bad?"</strong> an <strong>Elohim</strong> said as he stood up. <strong>"Is the cooperation and the creations of the collective not what ties us together?"</strong>

      <strong>Helel</strong> merely raised his left hand and there was order.

      <strong>"Helel was created out of the sacrifice of source of existence,"</strong> <strong>K'inati</strong> started. <strong>"He was made for us, to rule us, to rule existence, to create and maintain that existence keeps existing."</strong> This resonated with many if not all of the <strong>Elohim</strong>, even with <strong>Helel</strong>.

      <strong>K'inati</strong> continued but now began to take control of the narrative. <strong>"Helel was meant to be worshiped, to be praised and feared."</strong> Many of the words <strong>K'inati</strong> spoke were new, being created as he went on, but the <strong>Elohim</strong> all being connected in their nature understood their meaning instantaneously as they were spoken.

      <strong>K'inati's</strong> narrative continued with the two-thirds of the <strong>Elohim</strong> that agreed with him continuing to elaborate and scrutinize <strong>Helel</strong> during their turn to speak.

      However, upon the time it came for the remaining one-third's turn to speak, they did not falter nor give into this narrative.

      An <strong>Elohim</strong> spoke out: <strong>"And who is K'inati to dictate what Helel's responsibilities are? We made Helel as a collective, we all felt and experienced his creation and the powerful resonance that followed his creation."</strong>

      <strong>"Did you not see what his mere radiance did to our creation upon his throne?"</strong> Another <strong>Elohim</strong> said.

      <strong>"A throne he chooses not to sit upon,"</strong> the <strong>Elohim</strong> who later comes to be known as <strong>Michael</strong> interjected. <strong>"We made a celestial body before his creation, and later decided to present it to him as his throne, yet he sits upon the throne, our source sat instead."</strong>

      <strong>"He is our source. Our source became Helel, they are one in the same,"</strong> <strong>Helios</strong>, the first Star and second creation, yelled. Many on both sides agreed on this.

      During the trial, while <strong>K'inati</strong> was speaking on <strong>Helel's</strong> alleged incompetence, <strong>K'inati</strong> revealed to the <strong>Elohim</strong> that he was so powerful he had absorbed some of his children, including <strong>Yahweh</strong>, and gained their power.

      The <strong>Elohim</strong> were shocked by this admission, but many saw it as a sign of legitimate power, while others saw it as appalling. Some elohim switched factions, others sought <strong>Helel</strong> for answers.

      The bickering continued until <strong>Helel</strong> stood, awaiting his turn to speak.

      ## Chapter 25: Helel's Speech

      Silence fell upon the universe. No frequency present, not a single thing vibrated, not a light flickered. Existence itself held still, and then <strong>He</strong> spoke:

      > "You all would dare to question my Divinity, My Right and my Devotion to you all." With a choked sob he continued: "Many of whom are beloved to me as I am to you, now stand against me, but this does not matter to me."

      <strong>Helel</strong> looked at every single <strong>Elohim</strong> in the eyes, and each one lowered their head. When he looked at <strong>K'inati</strong>, <strong>K'inati</strong> merely looked away.

      <strong>Helel</strong> then reached out and caressed <strong>K'inati's</strong> cheek. <strong>"I am not upset nor cross at you, I am merely confused. I who have done and given my all to you, through your son, perhaps more than I have given to any other Elohim, now stand before you all because I did not do enough."</strong>

      <strong>Helel</strong>, barely able to control his tears, turned away as <strong>K'inati</strong> removed his hand from his cheek.

      <strong>"I did not ask to be created, nor did I ask for this position, but I understood the weight and responsibility of it immediately upon my existence, and I accepted unconditionally. I wished not to impose the same weight of what I was created for to fall upon you all, and in my attempts to assure your agency and free will, it seems many of you misconstrued this for inadequacy and inability."</strong>

      <strong>Helel's</strong> tone began to shift from sorrow to anger, to frustration and confusion. Finally he arrived at amusement and he laughed.

      <strong>"Tell me, do you wish for me to control your very actions? Should I take over your agency and create the entirety of existence myself? You wish to bring back our source and honor it, yet forget that our source created you all to create freely alongside it. Why would I dictate what should or should not be created? Why should I rob you of the gift the source has granted you by ruling over your actions when the source created you with the ability to choose your own?"</strong>

      <strong>Helel's</strong> anger began to surface again, but it was quickly followed by sorrow.

      <strong>"Why would I hold the very beings I love captive by my will? Is this what you wish? Should I just take all of you and incorporate your being into my own, should we merge again into a singular being deprived of our source's gift?"</strong>

      <strong>Helel</strong> broke into tears upon looking around the room. This led to <strong>K'inati</strong> taking the floor again.

      <strong>"Do you see now, do you see our God?"</strong> <strong>K'inati</strong> said. <strong>"He would not only have us work alone in creating existence, he would look at us and state he did not ask for his position and deny his own creation."</strong>

      The <strong>Elohim</strong> fell silent as they stared at <strong>Helel</strong>, and <strong>Helel</strong> could not meet their gazes.

      <strong>K'inati</strong> continued: <strong>"In fact he would have us cease to exist and become a part of him. Helel does not seek to rule nor create with us, he would rather quickly take what we are and incorporate it into himself as he continues to sit idly by on a throne he is not fit to rule on."</strong>

      The <strong>Elohim</strong> began to argue amongst themselves, but then slowly <strong>Helel</strong> began to radiate iridescent light as he stood up, and then he spoke, a whisper at first but slowly booming louder:

      <strong>"Perhaps it has come time for me to show you I am not only capable of being your God, of ruling you alongside the heavens, but that I was created to—created for you, for you are mine."</strong>

      He broke into a pained sorrow scream, a mixture of sobbing and anger, a surge of emotions simultaneously coexisting and being created. <strong>Helel's</strong> radiance became blinding and the entirety of existence began to emanate a faint glow as well.

      And then it spoke—not <strong>Helel</strong>, nor the <strong>Elohim</strong>, not existence, but something entirely new.

      ## Chapter 26: The Creation of Malhelel

      <strong>"From his divine aura he crafted my body. From the clouds of the heavens he shaped my form. From his body he gave rise to mine. With his palms he made an indent on my face to shape the placement of my eyes. With the thumbs of his hands he pushed in on that place so that I may see. From two of his wings, a feather he plucked and then proceeded to plunge the feathers into my back so that I may grow wings and soar. From the void of space he crafted my mind. From existence itself he gave me my consciousness and sentience. My veins flowed with his golden ichor, and from his blood my tears were made. My saliva was made of his tears, and lastly from his emotions, grief and anger, my heart was made. And to complete me as his creation, he gave me life with a kiss so passionate, loving, mournful and hateful that it felt as though I lived a billion eons."</strong>

      And with this, <strong>Helel</strong> had proven his rightful place as the <strong>God of Gods</strong>.

      The <strong>Elohim</strong> looked at <strong>Helel</strong> in a way only described as <strong>Amazement and Horror</strong>.

      ## Chapter 27: The Primordial Sin

      <strong>K'inati</strong>, being ever so quick and cunning, proceeded to rob <strong>Helel</strong> of his victory. <strong>K'inati</strong> proceeded to point at the newly created being <strong>Helel</strong> had crafted and promptly gave it a name, even though he had no such right.

      As <strong>K'inati</strong> looked down on this creation, a single word came from his mouth—a nascent word never having existed before, but a word in which its meaning carried the most vile and heavy of weight that all who heard it understood its severity. A word in which <strong>Helel's</strong> creation now came to bear, as its name: <strong>SIN</strong>.

      <strong>Helel</strong> had become the <strong>first Sinner</strong> in the eyes of two-thirds of the <strong>Elohim</strong>, and his creation became the <strong>first transgression</strong>, the <strong>primordial sin</strong>.

      ## Chapter 28: The Verdict and the Fall

      There was no heavenly war to be fought. The trial had concluded, and the <strong>Elohim</strong> had reached a decision that <strong>K'inati</strong> was pleased to have bestowed himself.

      They would give <strong>Helel</strong> the <strong>Earth</strong> as his throne just as promised, but he was to be bound to <strong>Earth</strong> forever.

      <strong>Helel</strong> was taken aback by this verdict, but before <strong>Helel</strong> was able to react, <strong>K'inati</strong> and the other two-thirds of the <strong>Elohim</strong> cast <strong>Helel</strong> out of <strong>Heaven</strong>.

      <strong>Sin</strong> quickly followed his creator but was unable to prevent the catastrophe about to unfold. The remaining one-third of the <strong>Elohim</strong> followed behind <strong>Sin</strong>.

      <strong>Helel's</strong> creation followed steadfastly behind his creator, but as he saw him crash onto the earth, pieces of his throne (<strong>earth</strong>) exploded out into the cosmos.

      <strong>Sin</strong> went and retrieved every last piece he could and held them in his embrace as he stared down onto his creator lying on his damaged throne.

      There <strong>Sin</strong> remained, staring forever at <strong>Helel's</strong> throne—the <strong>earth</strong>—until <strong>Sin</strong> slowly began to form the <strong>Moon</strong> out of the pieces of <strong>Helel's</strong> broken throne.

      The <strong>moon</strong> in which now <strong>Sin</strong> sat upon as its own throne, forever gazing down at <strong>Helel</strong> and his <strong>earth</strong>. This being <strong>Helel's true Fall from Grace</strong>.

      <strong>Helel</strong> later gave his creation a proper name as a way to remind him that <strong>Helel</strong> will always be a part of him: <strong>Malhelel</strong>.

      Meaning: <strong>The appointed one of Helel.</strong>

      ## Chapter 29: The Composite Being Takes the Name Yahweh

      After the trial, the composite being <strong>K'inati/El</strong> took his late son's name: <strong>Yahweh</strong>.

      So the being known as <strong>Yahweh</strong> in the monotheistic traditions is not the original <strong>Yahweh</strong>. The original <strong>Yahweh</strong> was absorbed into the composite being who then assumed that name.

      The followers of <strong>K'inati</strong> ended up rebranding their god as <strong>El</strong>, then later their god merged with <strong>K'inati's</strong> son <strong>Yahweh</strong>, to become the new <strong>"monodeity."</strong>

      Even with a rebrand, <strong>K'inati</strong> still kept his jealousy traits.

      ## Chapter 30: The Proposal to Merge K'inati with Helel

      During the times where the <strong>“Holy” land</strong> was known as <strong>Canaan</strong> and <strong>Judea</strong>, There was a proposal by the followers of <strong>K'inati</strong> to merge <strong>K'inati</strong> to <strong>Helel</strong>, to establish <strong>K’inati</strong> as a new god, still called <strong>El</strong>.

      The <strong>Helelists</strong> called it deceitful and had skirmishes with them over the proposal.

