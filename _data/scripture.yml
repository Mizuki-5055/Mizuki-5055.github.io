      # PART FIVE: THE PRISON KNOWN AS THE GARDEN OF EDEN

      ---

      ## Chapter 31: The Imprisonment of El

      After <strong>K'inati</strong> killed/absorbed <strong>Yahweh</strong> and banished <strong>Helel</strong> to earth, <strong>Malhelel</strong> took it upon himself to seek revenge, locking <strong>K’inati</strong> in a prison surrounded by four rivers.

      The rivers were carved by <strong>Ha’adyn</strong>, <strong>Watcher and Keeper of All Existence</strong>.

      <strong>Malhelel</strong> also placed other <strong>Gods</strong> around the prison as guards.

      <strong>Malhelel</strong> placed a copy of every creation inside this prison to remind him of why all the <strong>Elohim</strong> and their creations matter. Every vegetation and animal was present in this prison. This is now romanticized as the <strong>Garden of Eden</strong>.

      Here the newly formed <strong>El</strong> [<strong>K’iniati</strong>] tried to cement his newfound form by creating a pair of humans. He succeeded. However, <strong>Helel</strong> found out, due to his essence imbuing all of existence upon that existence existing.

      Seeing as <strong>Malhelel's</strong> rage forced him to lock up <strong>El</strong> out of revenge for <strong>Helel's</strong> grief, <strong>Helel</strong> chose not to intervene yet, as per his mandate and respect of <strong>Malhelel's</strong> free will.

      ## Chapter 32: Lilith and Adam

      When <strong>El</strong> created and named his creations <strong>Lilith</strong> and <strong>Adam</strong>, and then subsequently made <strong>Lilith</strong> inferior and even a slave to <strong>Adam</strong>, <strong>Helel</strong> stepped inside the prison and confronted <strong>El</strong> on his violation of the mandate.

      <strong>Lilith</strong> left the prison after learning there was a whole world outside of the prison and learning of her own free will from <strong>Helel</strong>.

      However, before <strong>Helel</strong> had a chance to engage with <strong>Adam</strong>, <strong>El</strong>, being cunning, began to test <strong>Helel</strong> of his own mandate. <strong>El</strong> claimed that unsolicited truths, even with well intentions, are a subtle violation of one's free will, as it can impose and cloud the sovereignty of a being.

      <strong>Helel</strong> agreed, and instead chose to pour the truth and the wisdom of unconditional free will into a tree in the prison. He then told <strong>El</strong> that if <strong>Adam</strong> chose to, of his own free will, eat of the tree, he could discern for himself whether to leave or stay in the prison with <strong>El</strong>.

      <strong>El</strong> agreed and <strong>Helel</strong> left.

      ## Chapter 33: Eve and the Serpent

      <strong>Helel</strong> later came back when <strong>Adam</strong> was mutilated, his rib being used to create another human, now known as <strong>Eve</strong>, and she was made submissive and inferior to <strong>Adam</strong>.

      <strong>Helel</strong>, seeing <strong>El</strong> not sticking to his promise, chose to match his own cunning and took the form of a <strong>snake</strong>. However, instead of imposing the truth, he merely taught her how to seek the truth herself and choose whether to accept it or not.

      He later left and came back when he learned they chose to eat the fruit and leave the prison. He had other gods who guarded the gates escort them away to freedom.

      <strong>El</strong> remained imprisoned in <strong>Eden</strong> until <strong>Malhelel</strong> chose to release him, even then it was only after <strong>Helel</strong> pleaded with <strong>Malhelel</strong> to stop breaking his mandate.

      Later on, <strong>El</strong> continued to make women inferior to men, and even demonized <strong>Lilith</strong> herself.

      The reason many accounts of <strong>Lilith</strong>, or even just feminine features given to the <strong>snake</strong> or the <strong>tempter</strong>, is due to the demeaning and demonization of <strong>Lilith</strong> and/or women.
