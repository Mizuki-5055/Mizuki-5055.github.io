heading: Truth is Sought, NEVER Dictated.
body: |-
  Welcome to Helelism—if you are here, that means you sought to know more.

  This site is a personal archive of hymns, literature, scripture, and photography, curated as a reflection on faith, beauty, and the human experience.

  The name _Helelism_ draws from the Aramaic word _Helel_, meaning "The God of Gods" or "God's God." The etymology of which is derived from the Aramaic words _Ha [The]_  and _El [God]_. This is why phonetically the word _Helel_ is pronounced as _Hal-el_, as opposed to _Hel-el._ 

  Thus, Helelism is the term for the Philosophy I have, based on the obfuscated, misconstrued and erased perspectives of Helelistic narratives and truths; historians, religions and followers of The Great Usurper seem to push. This an invitation to experience Existence through a Helelistic perspective.

  You're already here, already wondering, searching and curious. So stick around, who knows when I might reveal more.
