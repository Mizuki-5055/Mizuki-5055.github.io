heading: "About Helelism"
body: |
  Welcome to Helelism—a space where light, shadow, and the sacred meet.

  This site is a personal archive of hymns, literature, scripture, and photography, curated as a reflection on faith, beauty, and the human experience.

  The name *Helelism* draws from the Hebrew root *helel*, meaning "to shine" or "to praise." It is an invitation to see the divine in the ordinary and to find meaning in the margins.

  Thank you for visiting.
