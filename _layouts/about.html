---
layout: default
---

{% assign about = site.data.about %}

<section class="about-page">
  {% if about.heading %}
    <h2 class="page-heading">{{ about.heading }}</h2>
  {% endif %}

  <div class="about-body">
    {{ about.body | markdownify }}
  </div>

  <!-- Button at the bottom -->
  <div class="about-footer">
    <a href="{{ '/truth/' | relative_url }}" class="btn about-truth-btn">Explore the Truth</a>
  </div>
</section>
